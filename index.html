<!DOCTYPE html>
<html lang="ru">
<head>
<title>Ramossitto</title>
<meta name="theme-color" content="#4338F0">
<meta name="description" content="Тесты и игры по химии">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ramossitto">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="config.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
/* Layout: universal-indicator pH strip as the brand rainbow; element tiles for games and levels. One column on phones, two on desktop. */
:root{
  --bg:#F3F5FC; --surface:#FFFFFF; --sunk:#E9ECF7; --ink:#14173A; --muted:#5B6185; --line:#DADEF0;
  --accent:#4338F0; --accent-ink:#FFFFFF; --accent-deep:#2A20B8;
  --good:#11994B; --bad:#E0353A; --warn:#D98200;
  --good-bg:#DDF6E7; --bad-bg:#FDE3E3; --warn-bg:#FFF0D6;
  --t-test:#7B2FF7; --t-quiz:#F07F0A; --t-match:#0B94D1; --t-build:#139E4A; --t-cross:#E2336B;
  --hero:#171A45; --hero-ink:#FFFFFF; --hero-muted:#B9BEF0;
  --ph:linear-gradient(90deg,#E2336B,#F07F0A,#F2BE00,#139E4A,#0B94D1,#4338F0,#7B2FF7);
  --f-display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C0E22; --surface:#161937; --sunk:#1F2348; --ink:#ECEEFF; --muted:#9DA3CC; --line:#2C3160;
    --accent:#7C74FF; --accent-ink:#0C0E22; --accent-deep:#4B42D6;
    --good:#3DDC84; --bad:#FF6B6E; --warn:#FFB23F;
    --good-bg:#14372A; --bad-bg:#43191F; --warn-bg:#3D2C10;
    --t-test:#A884FF; --t-quiz:#FFA448; --t-match:#45C2F5; --t-build:#4FD17E; --t-cross:#FF6E9A;
    --hero:#1C1F55; --hero-ink:#FFFFFF; --hero-muted:#B9BEF0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
html{--sat:env(safe-area-inset-top, 0px)}
.chat .quick button.qback{background:var(--accent); border-color:var(--accent); color:#fff}
body{background:var(--bg); color:var(--ink); font:16px/1.5 var(--f-body); -webkit-font-smoothing:antialiased; padding-top:var(--sat)}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.2}
sub,sup{font-size:.7em; line-height:0}
.wrap{max-width:1040px; margin:0 auto; padding:24px 16px 64px}
.narrow{max-width:460px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.grow{flex:1; min-width:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.hidden{display:none!important}

/* Buttons & inputs */
.btn{border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:10px 16px; font-weight:600; cursor:pointer; display:inline-flex; gap:8px; align-items:center; justify-content:center; text-decoration:none; transition:transform .08s, background .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); box-shadow:0 3px 0 var(--accent-deep)}
.btn.primary:active{transform:translateY(3px); box-shadow:none}
.btn.big{padding:14px 22px; font-size:1.05rem; border-radius:14px}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent; border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px; font-size:.875rem}
.btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,.field:focus-visible,.opt:focus-visible,.card:focus-visible,.chip:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.field{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:11px 12px; font-size:16px}
.field:focus{border-color:var(--accent); outline:none}
textarea.field{min-height:260px; font-family:var(--f-mono); font-size:14px; line-height:1.6; resize:vertical}
.fgroup{display:grid; gap:6px}
.fgrid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* Brand */
.brand{display:flex; gap:12px; align-items:center}
.brand h1{font-family:var(--f-display); font-size:1.25rem; font-weight:700}
.brand .el{width:44px; height:44px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-family:var(--f-display); font-weight:700; position:relative; flex:none}
.brand .el i{position:absolute; top:2px; left:4px; font-style:normal; font-size:8px; line-height:1; font-family:var(--f-mono)}

.authtabs{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:5px; border-radius:14px; background:var(--surface); border:1px solid var(--line)}
.authtabs button{border:0; background:transparent; padding:10px; border-radius:10px; font-weight:700; color:var(--muted); cursor:pointer; font-size:15px}
.authtabs button.on{background:var(--accent); color:#fff}
/* Помощник */
.fab{position:fixed; right:16px; bottom:16px; z-index:15; display:flex; align-items:center; gap:8px; padding:12px 16px 12px 12px; border-radius:999px; border:0; background:var(--accent); color:#fff; font-weight:700; font-size:15px; box-shadow:0 10px 26px -8px var(--accent); cursor:pointer}
.fab .av{width:40px; height:40px; border-radius:50%; background:#fff; display:grid; place-items:center; overflow:hidden; margin:-6px 0 -6px -4px}
.fab .av svg{width:100%; height:100%}
.chat .hav{width:46px; height:46px; border-radius:50%; background:#fff; overflow:hidden; display:grid; place-items:center; flex:none}
.chat .hav svg{width:100%; height:100%}
.mini-hi{align-self:center; width:120px; height:132px; margin:4px 0 -4px}
.mini-hi svg{width:100%; height:100%}
.chat header h2 small{display:block; font:500 12px var(--f-body, inherit); opacity:.75; margin-top:2px}
.chat{position:fixed; inset:0; z-index:30; background:rgba(10,12,40,.45); display:flex; justify-content:flex-end}
.chat .sheet{width:min(460px,100%); height:100%; background:var(--bg); display:flex; flex-direction:column; box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.chat header{display:flex; align-items:center; gap:10px; padding:calc(14px + var(--sat)) 16px 14px; background:var(--hero); color:var(--hero-ink)}
.chat header h2{font:700 1.05rem var(--f-display); margin:0; flex:1}
.chat header .x{border:0; background:rgba(255,255,255,.15); color:inherit; width:36px; height:36px; border-radius:10px; font-size:20px; cursor:pointer}
.chat .msgs{flex:1; overflow-y:auto; padding:14px 14px 4px; display:flex; flex-direction:column; gap:10px}
.msg{max-width:88%; padding:10px 13px; border-radius:14px; line-height:1.45; font-size:15px; white-space:normal; overflow-wrap:anywhere}
.msg.u{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px}
.msg.m{align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:4px}
.msg img{display:block; max-width:100%; border-radius:10px; margin-bottom:6px}
.msg.wait{display:flex; align-items:center; gap:10px; padding:6px 12px 6px 6px}
.msg.wait .th{width:54px; height:54px; border-radius:50%; background:#fff; overflow:hidden; flex:none; animation:thk 1.4s ease-in-out infinite alternate; transform-origin:50% 90%}
.msg.wait .th svg{width:100%; height:100%}
.msg.wait .th .hand{animation:scr .5s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:80% 100%}
.msg.wait .th .q{animation:qq 1.4s ease-in-out infinite}
.msg.wait .dots{display:flex; gap:5px}
.msg.wait .dots i{width:8px; height:8px; border-radius:50%; background:var(--muted); opacity:.35; animation:dd 1.2s infinite}
.msg.wait .dots i:nth-child(2){animation-delay:.2s} .msg.wait .dots i:nth-child(3){animation-delay:.4s}
@keyframes thk{from{transform:rotate(-6deg)} to{transform:rotate(6deg)}}
@keyframes scr{from{transform:translateY(0)} to{transform:translateY(-3px) rotate(-6deg)}}
@keyframes qq{0%,100%{opacity:0} 50%{opacity:1}}
@keyframes dd{0%,100%{opacity:.25; transform:translateY(0)} 50%{opacity:1; transform:translateY(-4px)}}
.msg .retry{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.chat .who{display:flex; gap:6px; padding:8px 14px 0}
.chat .who button{flex:1; display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); background:var(--surface); border-radius:14px; padding:5px 10px 5px 5px; font-weight:700; font-size:14px; color:var(--ink); cursor:pointer}
.chat .who button.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--surface))}
.chat .who .h{width:34px; height:34px; border-radius:50%; background:#fff; overflow:hidden; flex:none; border:1px solid var(--line)}
.chat .who .h svg{width:100%; height:100%}
.fab .av + .av{margin-left:-18px; box-shadow:0 0 0 2px var(--accent)}
@media (prefers-reduced-motion: reduce){ .msg.wait .th, .msg.wait .th .hand, .msg.wait .dots i, .msg.wait .th .q{animation:none} }
.chat .quick{display:flex; gap:6px; flex-wrap:wrap; padding:6px 14px}
.chat .quick button{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink)}
.chat form{display:flex; gap:8px; align-items:flex-end; padding:10px 14px 16px; border-top:1px solid var(--line); background:var(--surface)}
.chat textarea{flex:1; resize:none; max-height:140px; min-height:44px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; font-size:16px; background:var(--bg); color:var(--ink)}
.chat .ib{width:44px; height:44px; flex:none; border-radius:12px; border:1px solid var(--line); background:var(--bg); cursor:pointer; display:grid; place-items:center; color:var(--ink)}
.chat .ib.send{background:var(--accent); border-color:var(--accent); color:#fff}
.chat .pv{padding:0 14px; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.chat .pv img{height:48px; border-radius:8px}
body.hasfab .wrap{padding-bottom:90px}
/* Выбор предмета */
.subj-hero{position:relative; overflow:hidden; border-radius:24px; padding:26px 20px 22px; margin-top:14px; background:radial-gradient(120% 90% at 0% 0%, #2B1F7A 0%, #171A45 55%, #0B3B2E 100%); color:#fff}
.subj-hero h2{font:700 1.6rem/1.15 var(--f-display); margin:0; position:relative}
.subj-hero p{margin:8px 0 0; opacity:.8; position:relative; max-width:34ch}
.subj-hero .deco{position:absolute; inset:0; pointer-events:none; opacity:.22}
.subjects{display:grid; gap:16px; margin-top:16px; grid-template-columns:1fr}
@media (min-width:760px){ .subjects{grid-template-columns:1fr 1fr} }
.subj{position:relative; overflow:hidden; border:0; border-radius:24px; min-height:210px; padding:22px; text-align:left; color:#fff; cursor:pointer; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; box-shadow:0 18px 40px -22px var(--sc); transition:transform .15s, box-shadow .15s; animation:rise .45s both}
.subj:hover{transform:translateY(-4px)}
.subj:focus-visible{outline:3px solid var(--sc); outline-offset:3px}
.subj.chem{--sc:#5B3BF0; background:linear-gradient(135deg,#4338F0 0%,#7B2FF7 60%,#B44CF0 100%)}
.subj.bio{--sc:#13A06B; background:linear-gradient(135deg,#0E9F6E 0%,#22C55E 60%,#84CC16 100%); animation-delay:.08s}
.subj .art{position:absolute; right:-10px; top:-6px; width:62%; max-width:260px; opacity:.95; pointer-events:none}
.subj h3{font:700 1.7rem/1 var(--f-display); margin:0; position:relative}
.subj .sub{position:relative; opacity:.9; font-size:.95rem; max-width:24ch}
.subj .go{position:relative; margin-top:10px; align-self:flex-start; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:8px 16px; font-weight:700; font-size:.95rem}
.subj .soon{position:absolute; right:18px; top:18px; background:#FFD447; color:#5A4300; font-weight:800; font-size:.8rem; padding:5px 12px; border-radius:999px; letter-spacing:.02em}
.subj.alevel{--sc:#B7791F; background:radial-gradient(120% 120% at 100% 0%, #3B2A8A 0%, #16204F 55%, #0B1230 100%); animation-delay:.16s; min-height:190px}
.subj.alevel h3{font-size:1.9rem; letter-spacing:.01em}
.subj.alevel h3 em{font-style:normal; color:#FFD27A}
.subj .tag{position:relative; align-self:flex-start; font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#FFD27A; opacity:.95}
.al-hero{background:radial-gradient(120% 120% at 100% 0%, #3B2A8A 0%, #16204F 55%, #0B1230 100%)}
.al-hero h2 em{font-style:normal; color:#FFD27A}
.alsubj{display:grid; gap:14px; margin-top:16px; grid-template-columns:1fr 1fr}
@media (max-width:560px){ .alsubj{grid-template-columns:1fr} }
.alsubj .subj{min-height:180px}
.subj.alchem{--sc:#5B3BF0; background:linear-gradient(150deg,#1E1B6E 0%,#4338F0 55%,#8B5CF6 100%)}
.subj.albio{--sc:#13A06B; background:linear-gradient(150deg,#064E3B 0%,#0E9F6E 55%,#4ADE80 100%); animation-delay:.08s}
.alsubj .subj .art{width:52%}
.alsoon{text-align:center; padding:30px 20px}
.alsoon .ic{width:64px; height:64px; margin:0 auto 12px; border-radius:20px; display:grid; place-items:center; background:color-mix(in srgb, var(--accent) 12%, var(--surface)); color:var(--accent)}
.alsoon .ic svg{width:34px; height:34px}
.alchips{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:14px}
.alpaper .aph{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.alpaper .aph h2{margin:0}
.alpaper .apn{width:46px; height:46px; flex:none; border-radius:14px; display:grid; place-items:center; font:800 17px/1 var(--f-display); color:#FFD27A; background:linear-gradient(150deg,#16204F,#3B2A8A)}
.alchips span{padding:6px 12px; border-radius:999px; background:var(--sunk); font-size:13px; font-weight:700; color:var(--muted)}
.subj-page{position:relative}
.subj-page::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; transform:translateZ(0); will-change:transform; background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22240%22%20height%3D%22240%22%20viewBox%3D%220%200%20240%20240%22%20fill%3D%22none%22%20stroke%3D%22%236D5BF5%22%20stroke-opacity%3D%22.13%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M30%2020l18%2010v20L30%2060%2012%2050V30z%22/%3E%3Cpath%20d%3D%22M48%2030l18-10%2018%2010v20L66%2060%22/%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%22150%22%20r%3D%227%22/%3E%3Ccircle%20cx%3D%2266%22%20cy%3D%22136%22%20r%3D%225%22/%3E%3Cpath%20d%3D%22M46%20146l15-7%22/%3E%3Cpath%20d%3D%22M150%2020h18M154%2020v26l-18%2034a8%208%200%200%200%207%2012h30a8%208%200%200%200%207-12l-18-34V20%22/%3E%3Cg%20stroke%3D%22%2316A34A%22%20stroke-opacity%3D%22.15%22%3E%3Cpath%20d%3D%22M180%20120c18%2014%2018%2028%200%2042s-18%2028%200%2042%22/%3E%3Cpath%20d%3D%22M204%20120c-18%2014-18%2028%200%2042s18%2028%200%2042%22/%3E%3Cpath%20d%3D%22M185%20133h14M185%20175h14%22/%3E%3Cpath%20d%3D%22M90%20200c0-22%2016-36%2036-38%202%2020-14%2038-36%2038z%22/%3E%3Cellipse%20cx%3D%22110%22%20cy%3D%2290%22%20rx%3D%2218%22%20ry%3D%2213%22/%3E%3Ccircle%20cx%3D%22113%22%20cy%3D%2289%22%20r%3D%224%22/%3E%3C/g%3E%3C/svg%3E") repeat, var(--bg)}
@media (max-width:600px){ .subj .art{width:48%; right:-14px; top:auto; bottom:-8px; opacity:.55} .subj .sub{max-width:26ch} .subj{min-height:190px} }
.subj h3,.subj .sub,.subj .go{z-index:1}
.bio-soon{text-align:center; padding:28px 20px}
.bio-soon svg{width:180px; height:auto}
/* Element tile */
.tile{--tc:var(--accent); width:64px; height:72px; flex:none; border-radius:12px; border:2px solid var(--tc); background:color-mix(in srgb, var(--tc) 12%, var(--surface)); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:0 2px 7px; overflow:hidden; color:var(--tc)}
.tile i{position:absolute; top:3px; left:5px; font-style:normal; font:500 10px/1 var(--f-mono)}
.tile b{font:700 21px/1 var(--f-display); white-space:nowrap}
.tile small{font-size:7.5px; line-height:1.1; margin-top:4px; text-transform:uppercase; letter-spacing:0; font-weight:700; text-align:center; max-width:100%; overflow-wrap:normal}

/* Cards */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px}
.list{display:grid; gap:10px}
.card{display:flex; gap:16px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; cursor:pointer; text-align:left; width:100%; transition:border-color .15s, transform .15s, box-shadow .15s; animation:rise .35s both}
.card:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 22px -12px var(--accent)}
.grid2{display:grid; gap:12px; grid-template-columns:1fr}
@media (min-width:760px){ .grid2{grid-template-columns:1fr 1fr} }
.card h3{font-size:1.05rem; font-weight:600}
.meta{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.85rem; color:var(--muted); margin-top:4px}
.pill{display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 10px; font-size:.8rem; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums}
.pill.good{background:var(--good-bg); color:var(--good)}
.pill.bad{background:var(--bad-bg); color:var(--bad)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.none{background:var(--sunk); color:var(--muted)}

/* Play */
.bar{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); margin-top:calc(-1 * var(--sat)); padding-top:var(--sat)}
.bar #exitBtn{min-height:42px; padding:8px 14px; font-size:15px}
.bar .wrap{padding-top:10px; padding-bottom:10px}
.timer{font:500 1rem var(--f-mono); font-variant-numeric:tabular-nums; padding:4px 10px; border-radius:8px; background:var(--sunk)}
.timer.low{background:var(--bad-bg); color:var(--bad)}
.progress{height:4px; background:var(--sunk); border-radius:4px; overflow:hidden; margin-top:8px}
.progress span{display:block; height:100%; background:var(--ph); background-size:1040px 100%; transition:width .3s}
.q-text{font-size:clamp(1.25rem,4vw,1.6rem); font-weight:600; margin:8px 0 22px}
.opts{display:grid; gap:10px}
.opt{display:flex; gap:12px; align-items:center; text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:14px; cursor:pointer; font-size:1.05rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:30px; height:30px; flex:none; border-radius:7px; background:var(--sunk); display:grid; place-items:center; font-weight:700; font-size:.9rem}
.opt.good{border-color:var(--good); background:var(--good-bg)}
.opt.bad{border-color:var(--bad); background:var(--bad-bg)}
.feedback{min-height:28px; margin-top:14px; font-weight:600}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}

/* Hero, levels, nav, rating */
.hero{position:relative; overflow:hidden; background:var(--hero); color:var(--hero-ink); border-radius:24px; padding:22px 22px 26px; margin-top:16px}
.hero::before{content:""; position:absolute; inset:-40% -10% auto auto; width:320px; height:320px; border-radius:50%; background:radial-gradient(circle, rgba(123,47,247,.55), transparent 65%); pointer-events:none}
.hero::after{content:""; position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--ph)}
.hero > *{position:relative}
.hero h1{font:700 clamp(1.3rem,4.5vw,1.9rem)/1.15 var(--f-display)}
.hero .muted{color:var(--hero-muted)}
.lvl{width:92px; height:104px; flex:none; padding:0 4px 12px; justify-content:flex-end !important; overflow:hidden; border-radius:14px; background:linear-gradient(160deg,#FFFFFF,#E6E4FF); color:#2A20B8; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 0 0 3px rgba(255,255,255,.15), 0 10px 30px -8px rgba(124,116,255,.8); animation:float 4s ease-in-out infinite}
.lvl i{position:absolute; top:6px; left:8px; font:500 13px var(--f-mono); font-style:normal}
.lvl b{font:700 36px/1 var(--f-display)}
.lvl small{font-size:11px; font-weight:700; margin-top:6px; text-align:center; max-width:100%; line-height:1.1}
.xpbar{height:12px; border-radius:12px; background:rgba(255,255,255,.14); overflow:hidden; margin-top:8px}
.xpbar span{display:block; height:100%; background:var(--ph); background-size:400px 100%; border-radius:12px; transition:width .6s}
.hstats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px}
.hstats div{background:rgba(255,255,255,.08); border-radius:14px; padding:10px 12px}
.hstats b{display:block; font:700 1.25rem var(--f-display); font-variant-numeric:tabular-nums}
.hstats span{font-size:.75rem; color:var(--hero-muted)}
.nav{display:flex; gap:6px; margin:18px 0 6px; background:var(--sunk); padding:5px; border-radius:16px}
.nav button{flex:1; border:0; background:transparent; padding:10px 8px; border-radius:12px; font-weight:700; cursor:pointer; color:var(--muted)}
.nav button.on{background:var(--surface); color:var(--accent); box-shadow:0 2px 6px rgba(20,23,58,.08)}
.rank{display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 14px; animation:rise .35s both}
.rank.me{border:2px solid var(--accent)}
.medal{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font:700 .9rem var(--f-display); background:var(--sunk); color:var(--muted); flex:none}
.medal.m1{background:#FFD54A; color:#5A4200} .medal.m2{background:#D6DBE6; color:#3B4255} .medal.m3{background:#E9A36A; color:#4A2508}
.mini{width:34px; height:38px; flex:none; border-radius:7px; border:2px solid var(--accent); color:var(--accent); display:grid; place-items:center; font:700 .95rem var(--f-display)}
.helpc{display:flex; gap:14px; align-items:flex-start}
.helpc h3{font-size:1.05rem; margin-bottom:4px}
.helpc p{margin:0; color:var(--muted)}
.steps{margin:6px 0 0; padding-left:20px; color:var(--muted)} .steps li{margin:3px 0}
.iconbtn{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; color:var(--ink)}
.xp-gain{display:inline-block; margin-top:12px; padding:6px 14px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-weight:700; animation:pop .5s both .3s}
.lvlup{margin-top:12px; padding:12px; border-radius:14px; background:var(--hero); color:var(--hero-ink); font-weight:600; animation:pop .5s both .5s}
@keyframes rise{from{opacity:.001; transform:translateY(8px)} to{opacity:1; transform:none}}
@keyframes pop{0%{transform:scale(.6); opacity:.001} 70%{transform:scale(1.08); opacity:1} 100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes shake{0%,100%{transform:none} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)}}
@keyframes bounce{0%,100%{transform:none} 40%{transform:scale(1.04)}}
.opt.bad,.mcard.miss,.slots.bad{animation:shake .4s}
.opt.good,.mcard.done,.slots.good{animation:bounce .35s}
.score{animation:pop .6s both}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:30}

/* Три раздела химии */
.branches{display:grid; gap:14px; grid-template-columns:1fr; margin-top:6px}
@media (min-width:860px){ .branches{grid-template-columns:repeat(3,1fr)} }
@media (min-width:600px){ .branches.b4{grid-template-columns:repeat(2,1fr)} }
.branch{--bc:var(--accent); position:relative; overflow:hidden; display:flex; flex-direction:column; gap:12px; text-align:left; cursor:pointer; width:100%;
  background:var(--surface); border:2px solid color-mix(in srgb, var(--bc) 35%, var(--line)); border-radius:22px; padding:18px; transition:transform .15s, box-shadow .15s, border-color .15s; animation:rise .4s both}
.branch:hover{transform:translateY(-3px); border-color:var(--bc); box-shadow:0 14px 30px -16px var(--bc)}
.branch:focus-visible{outline:3px solid var(--bc); outline-offset:3px}
.branch::after{content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:color-mix(in srgb, var(--bc) 14%, transparent); pointer-events:none}
.branch .head{display:flex; gap:14px; align-items:center; position:relative}
.btile{width:62px; height:70px; flex:none; border-radius:12px; background:var(--bc); color:#fff; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:0 2px 8px; overflow:hidden}
.btile i{position:absolute; top:4px; left:6px; font:500 10px/1 var(--f-mono); font-style:normal; opacity:.9}
.btile b{font:700 24px/1 var(--f-display)}
.btile small{font-size:7.5px; line-height:1.1; font-weight:700; margin-top:4px; text-transform:uppercase; letter-spacing:0; text-align:center; max-width:100%}
.branch h2{font:700 1.15rem/1.2 var(--f-display); color:var(--ink)}
.branch p{margin:0; color:var(--muted); font-size:.9rem; position:relative}
.branch .foot{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:.85rem; color:var(--muted); position:relative}
.branch .bar2{max-width:none; margin-top:0}
.branch.soon{opacity:.75}

/* Test (exam) */
.qnav{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 18px}
.qn{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface); font:500 .85rem var(--f-mono); cursor:pointer}
.qn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.qn.good{background:var(--good-bg); border-color:var(--good); color:var(--good)}
.qn.bad{background:var(--bad-bg); border-color:var(--bad); color:var(--bad)}
.tq{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; scroll-margin-top:90px}
.tq h3{font-size:1.1rem; font-weight:600; margin:6px 0 14px}
.tq .opt{padding:11px 12px; font-size:1rem}
.opt.sel{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface))}
.opt.sel .k{background:var(--accent); color:var(--accent-ink)}
.tfoot{position:sticky; bottom:0; background:var(--bg); border-top:1px solid var(--line); margin-top:18px; padding:12px 0 calc(12px + env(safe-area-inset-bottom, 0px))}

/* Catalog */
.sec{margin-top:26px}
.sec h2{font:600 .8rem var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
.tnum{--tc:var(--accent); width:52px; height:56px; flex:none; border-radius:12px; background:color-mix(in srgb, var(--tc) 15%, var(--surface)); border:2px solid var(--tc); display:grid; place-items:center; font:700 1.1rem var(--f-display); color:var(--tc)}
.tnum.done{background:var(--good-bg); color:var(--good)}
.bar2{height:6px; background:var(--sunk); border-radius:6px; overflow:hidden; margin-top:8px; max-width:220px}
.bar2 span{display:block; height:100%; background:var(--ph); background-size:220px 100%}

/* Match */
.mgrid{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.mcard{aspect-ratio:1; max-width:100%; border-radius:12px; border:2px solid var(--line); background:var(--sunk); cursor:pointer; display:grid; place-items:center; padding:6px; font-weight:600; font-size:.95rem; overflow-wrap:anywhere; text-align:center; transition:transform .15s, background .15s; position:relative}
.mcard .back{font:700 1.4rem var(--f-display); color:var(--muted); opacity:.5}
.mcard.open{background:var(--surface); border-color:var(--accent)}
.mcard.open.a{font-family:var(--f-display); font-size:1.3rem}
.mcard.done{background:var(--good-bg); border-color:var(--good); cursor:default}
.mcard.miss{background:var(--bad-bg); border-color:var(--bad)}
.mcard:not(.open):not(.done):hover{transform:translateY(-2px)}

/* Build */
.slots{min-height:64px; border:2px dashed var(--line); border-radius:12px; padding:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--surface)}
.slots.good{border-color:var(--good); border-style:solid; background:var(--good-bg)}
.slots.bad{border-color:var(--bad); border-style:solid; background:var(--bad-bg)}
.bank{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.chip{border:2px solid var(--t-build); color:var(--ink); background:var(--surface); border-radius:9px; padding:9px 14px; font-weight:600; font-size:1.1rem; cursor:pointer; min-width:44px}
.chip:hover{background:color-mix(in srgb, var(--t-build) 14%, var(--surface))}
.slots .chip{border-color:var(--accent)}

/* Crossword */
.xwrap{overflow-x:auto; padding-bottom:6px}
.xgrid{display:grid; gap:2px; width:max-content; margin:0 auto}
.xc{width:var(--cs); height:var(--cs); position:relative}
.xc input{width:100%; height:100%; border:1.5px solid var(--line); border-radius:4px; background:var(--surface); text-align:center; text-transform:uppercase; font-weight:700; font-size:max(16px, calc(var(--cs) * .5)); padding:0; caret-color:var(--accent)}
.xc input:focus{outline:none; border-color:var(--accent); background:color-mix(in srgb, var(--accent) 18%, var(--surface))}
.xc.hl input{background:color-mix(in srgb, var(--accent) 9%, var(--surface))}
.xc.ok input{background:var(--good-bg); border-color:var(--good)}
.xc.no input{background:var(--bad-bg); border-color:var(--bad)}
.xc i{position:absolute; top:1px; left:3px; font:500 9px var(--f-mono); color:var(--muted); pointer-events:none; z-index:1}
.clues{display:grid; gap:20px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); margin-top:22px}
.clues ol{list-style:none; padding:0; margin:8px 0 0; display:grid; gap:4px}
.clues li{padding:6px 8px; border-radius:8px; cursor:pointer; display:flex; gap:8px}
.clues li b{font-family:var(--f-mono); min-width:22px}
.clues li.on{background:color-mix(in srgb, var(--accent) 14%, transparent)}
.clues li.ok{color:var(--good)} .clues li.no{color:var(--bad)}

/* Result */
.score{font:700 clamp(3rem,12vw,4.5rem)/1 var(--f-display); font-variant-numeric:tabular-nums}
.review{display:grid; gap:8px; margin-top:16px}
.review div{padding:10px 12px; border-radius:10px; background:var(--sunk); font-size:.95rem}

/* Teacher */
.tabs{display:flex; gap:4px; background:var(--sunk); padding:4px; border-radius:12px; width:max-content; max-width:100%; overflow-x:auto}
.tabs button{border:0; background:transparent; padding:8px 16px; border-radius:9px; font-weight:600; cursor:pointer; color:var(--muted); white-space:nowrap}
.tabs button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
.seg button{display:flex; gap:10px; align-items:center; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:8px; cursor:pointer; text-align:left; font-weight:600}
.seg button .tile{width:40px; height:44px} .seg button .tile b{font-size:15px} .seg button .tile small,.seg button .tile i{display:none}
.seg button.on{border-color:var(--accent)}
.hint{background:var(--sunk); border-radius:10px; padding:12px 14px; font-size:.9rem}
.hint pre{margin:6px 0 0; font:13px/1.55 var(--f-mono); white-space:pre-wrap}
.parse{font-size:.9rem}
.parse .err{color:var(--bad)}
.switch{position:relative; width:42px; height:24px; flex:none}
.switch input{opacity:0; width:100%; height:100%; margin:0; cursor:pointer; position:absolute; z-index:1}
.switch span{position:absolute; inset:0; background:var(--line); border-radius:99px; transition:.2s}
.switch span::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s}
.switch input:checked+span{background:var(--good)}
.switch input:checked+span::after{left:21px}
.switch input:focus-visible+span{outline:3px solid var(--accent); outline-offset:2px}
.trow{display:flex; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; flex-wrap:wrap}
.tscroll{overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:.92rem}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; background:var(--sunk)}
td.num{font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.sub td{background:var(--bg); font-size:.85rem; white-space:normal}
.stats{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.stat b{display:block; font:700 1.5rem var(--f-display); font-variant-numeric:tabular-nums}
.linkbox{display:flex; gap:8px; flex-wrap:wrap}
.linkbox input{flex:1; min-width:200px; font-family:var(--f-mono); font-size:13px}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:10px; font-weight:600; z-index:20; max-width:calc(100% - 32px)}
.loading{display:grid; place-items:center; min-height:50vh; color:var(--muted)}
.empty{text-align:center; padding:40px 16px; color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
@media (max-width:520px){ .tile{width:56px; height:64px; padding-bottom:6px} .tile b{font-size:18px} .tile small{font-size:7px} .card{gap:12px; padding:12px} }
/* Серии, награды, карточки */
.hstats.h4{grid-template-columns:repeat(4,1fr)}
.hstats .stk b{display:flex; align-items:center; gap:4px; color:#FFB547}
.hstats .stk b svg{width:20px; height:20px}
.hstats .stk.off b{color:var(--hero-muted)}
@media (max-width:460px){ .hstats.h4{grid-template-columns:repeat(2,1fr)} }
.nav button{font-size:14px; padding:10px 4px}
.daily{display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin:14px 0 4px; padding:14px 16px; border-radius:18px; border:0; cursor:pointer; color:#fff; background:linear-gradient(120deg,#F07F0A,#E2336B); box-shadow:0 10px 24px -12px #E2336B; font:inherit}
.daily.done{background:linear-gradient(120deg,#139E4A,#0B94D1); box-shadow:0 10px 24px -12px #139E4A}
.daily .dl{width:44px; height:44px; border-radius:14px; background:rgba(255,255,255,.2); display:grid; place-items:center; font-weight:800; font-size:20px; flex:none}
.daily small{display:block; font-weight:700; opacity:.9; text-transform:uppercase; letter-spacing:.03em; font-size:11px}
.daily b{display:block; font-size:16px; line-height:1.25; margin:2px 0}
.daily span{font-size:13px; opacity:.9}
.daily .go{font-weight:800; font-size:14px; white-space:nowrap; opacity:1}
.streakp .weekrow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:16px}
.wd{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; color:var(--muted); font-weight:700}
.wd i{width:34px; height:34px; border-radius:50%; background:var(--sunk); display:grid; place-items:center; color:#F07F0A; font-style:normal}
.wd.on i{background:#FFF1DE}
.wd.today span{color:var(--accent)}
.wd.today i{box-shadow:0 0 0 2px var(--accent)}
.bigflame{width:56px; height:56px; border-radius:18px; background:var(--sunk); color:var(--muted); display:grid; place-items:center; flex:none}
.bigflame svg{width:32px; height:32px}
.bigflame.on{background:linear-gradient(140deg,#FFB547,#F07F0A); color:#fff}
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:10px}
.badge{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 10px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px}
.badge b{font-size:14px; line-height:1.2}
.badge span{font-size:12px; color:var(--muted); line-height:1.3}
.badge:not(.got){opacity:.7}
.bdg{width:56px; height:56px; border-radius:50%; display:grid; place-items:center; color:#fff; background:var(--bc); position:relative; box-shadow:inset 0 -4px 0 rgba(0,0,0,.18), 0 0 0 4px color-mix(in srgb, var(--bc) 25%, transparent); margin-bottom:4px}
.badge .bdg b, .bpop .bdg b{font:800 15px var(--f-display); position:relative; color:#fff; z-index:1}
.badge .bdg.off b{color:var(--muted)}
.bdg svg{position:absolute; width:40px; height:40px; opacity:.28}
.bdg.off{background:var(--sunk); color:var(--muted); box-shadow:inset 0 0 0 2px var(--line)}
.bpop{position:fixed; left:50%; top:calc(16px + var(--sat)); transform:translateX(-50%); z-index:60; display:flex; gap:12px; align-items:center; background:var(--surface); color:var(--ink); border-radius:18px; padding:12px 16px 12px 12px; box-shadow:0 20px 40px -12px rgba(0,0,0,.35); border:1px solid var(--line); animation:bpop .4s ease-out; max-width:calc(100% - 32px)}
.bpop .bdg{margin:0; flex:none}
.bpop small{display:block; color:var(--accent); font-weight:800; font-size:12px; text-transform:uppercase}
.bpop b{display:block}
.bpop span{font-size:13px; color:var(--muted)}
@keyframes bpop{from{opacity:0; transform:translate(-50%,-20px)} to{opacity:1; transform:translate(-50%,0)}}
.cardsbtn{border-style:dashed !important}
.fc{display:block; width:100%; min-height:260px; position:relative; border:0; background:transparent; cursor:pointer; perspective:1200px; padding:0; font:inherit; color:inherit}
.fside{position:absolute; inset:0; border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:24px; text-align:center; backface-visibility:hidden; -webkit-backface-visibility:hidden; transition:transform .45s ease}
.fside small{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:.7}
.fside b{font:700 clamp(1.15rem,4.6vw,1.6rem)/1.3 var(--f-display)}
.fside i{font-size:12px; opacity:.6}
.f1{background:var(--surface); border:1px solid var(--line); box-shadow:0 14px 30px -18px rgba(20,23,58,.35)}
.f2{background:var(--hero); color:var(--hero-ink); transform:rotateY(180deg)}
.fc.flip .f1{transform:rotateY(-180deg)}
.fc.flip .f2{transform:rotateY(0)}
.fcbtn{margin-top:16px}
.fcbtn .btn{flex:1}
@media (prefers-reduced-motion: reduce){ .fside{transition:none} }
.rseg{display:inline-flex; gap:4px; background:var(--sunk); padding:4px; border-radius:12px; margin-bottom:12px}
.rseg button{border:0; background:transparent; padding:7px 14px; border-radius:9px; font-weight:700; color:var(--muted); cursor:pointer}
.rseg button.on{background:var(--surface); color:var(--accent)}

/* Таблица Менделеева, дуэли, аналитика */
.ptbtn{display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin:10px 0 4px; padding:12px 14px; border-radius:18px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font:inherit; color:var(--ink)}
.ptbtn .pte{pointer-events:none}
.ptbtn b{display:block; font-size:16px} .ptbtn span.s{font-size:13px; color:var(--muted)}
.ptwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:8px}
.ptgrid{display:grid; grid-template-columns:repeat(18, 62px); grid-template-rows:20px repeat(7, 76px) 12px 76px 76px; gap:3px; width:max-content}
.pte.ptx{width:62px; height:76px; justify-content:flex-end; padding:0 2px 4px}
.ptx i{top:3px; left:4px; font:700 11px/1 var(--f-display); opacity:1}
.ptx u{position:absolute; top:2px; right:2px; min-width:22px; height:22px; padding:0 2px; border:1.5px solid currentColor; border-radius:50%; display:grid; place-items:center; font:600 9.5px/1 var(--f-body, inherit); text-decoration:none; opacity:.85; box-sizing:border-box}
.ptx b{font-size:19px}
.ptx em{font-style:normal; font-weight:700; font-size:10.5px; line-height:1; margin-top:3px; font-variant-numeric:tabular-nums}
.ptx small{font-size:8px; margin-top:3px; max-width:58px}
.ptg{font-size:11px; color:var(--muted); text-align:center; font-weight:700}

const PARSE = {
  quiz(src){
    const items = [], errors = [];
    String(src || '').replace(/\r/g, '').split(/\n\s*\n/).forEach((block, bi) => {
      const lines = block.split('\n').map(s => s.trim()).filter(Boolean);
      if (!lines.length) return;
      const q = lines[0], opts = [], n = items.length + errors.length + 1;
      let correct = -1;
      lines.slice(1).forEach(l => { if (l[0] === '*'){ if (correct < 0) correct = opts.length; opts.push(l.slice(1).trim()); } else opts.push(l); });
      if (opts.length < 2) errors.push(`Вопрос ${n} («${q.slice(0, 30)}»): нужно минимум 2 варианта ответа`);
      else if (correct < 0) errors.push(`Вопрос ${n} («${q.slice(0, 30)}»): отметьте правильный ответ звёздочкой *`);
      else items.push({q, options: opts, correct});
    });
    return {items, errors, label: n => plural(n, 'вопрос', 'вопроса', 'вопросов')};
  },
  test(src){ return PARSE.quiz(src); },
  match(src){
    const items = [], errors = [];
    String(src || '').replace(/\r/g, '').split('\n').forEach((l, i) => {
      l = l.trim(); if (!l) return;
      const k = l.indexOf('=');
      if (k < 1 || !l.slice(k + 1).trim()) { errors.push(`Строка ${i + 1}: нужен формат «А = Б»`); return; }
      items.push({a: l.slice(0, k).trim(), b: l.slice(k + 1).trim()});
    });
    if (items.length > 15) errors.push('Больше 15 пар — на телефоне будет тесно. Лучше разбейте на две игры.');
    return {items, errors, label: n => plural(n, 'пара', 'пары', 'пар')};
  },
  build(src){
    const items = [], errors = [];
    String(src || '').replace(/\r/g, '').split('\n').forEach((l, i) => {
      l = l.trim(); if (!l) return;
      const k = l.indexOf('=');
      if (k < 1) { errors.push(`Строка ${i + 1}: нужен формат «Задание = части ответа»`); return; }
      const rest = l.slice(k + 1).split('||');
      const tokens = rest[0].trim().split(/\s+/).filter(Boolean);
      const extra = (rest[1] || '').trim().split(/\s+/).filter(Boolean);
      if (tokens.length < 2) { errors.push(`Строка ${i + 1}: в ответе должно быть минимум 2 части через пробел`); return; }
      items.push({prompt: l.slice(0, k).trim(), tokens, extra});
    });
    return {items, errors, label: n => plural(n, 'задание', 'задания', 'заданий')};
  },
  cross(src){
    const items = [], errors = [];
    String(src || '').replace(/\r/g, '').split('\n').forEach((l, i) => {
      l = l.trim(); if (!l) return;
      const k = l.indexOf('=');
      if (k < 1) { errors.push(`Строка ${i + 1}: нужен формат «СЛОВО = подсказка»`); return; }
      const word = l.slice(0, k).trim().toUpperCase().replace(/Ё/g, 'Е').replace(/[\s\-]/g, '');
      if (!/^[A-ZА-Я0-9]{2,}$/.test(word)) { errors.push(`Строка ${i + 1}: слово «${l.slice(0, k).trim()}» должно состоять только из букв`); return; }
      items.push({word, clue: l.slice(k + 1).trim()});
    });
    if (items.length > 20) errors.push('Больше 20 слов — кроссворд выйдет огромным.');
    return {items, errors, label: n => plural(n, 'слово', 'слова', 'слов')};
  }
};

}

    const letterAt = {};
    L.placed.forEach((p, wi) => { for (let k = 0; k < p.word.length; k++){ const r = p.r + (p.dir ? k : 0), c = p.c + (p.dir ? 0 : k), key = r + ',' + c; (letterAt[key] = letterAt[key] || {ch: p.word[k], w: []}).w.push(wi); } });
    const numAt = {}; L.placed.forEach(p => numAt[p.r + ',' + p.c] = p.num);
    for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++){
      const key = r + ',' + c;
      html += letterAt[key] ? `<div class="xc" data-key="${key}">${numAt[key] ? `<i>${numAt[key]}</i>` : ''}<input maxlength="2" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Клетка"></div>` : '<div></div>';
    }
    html += `</div></div><div class="clues">
      ${[0, 1].map(d => `<div><div class="label">${d ? 'По вертикали ↓' : 'По горизонтали →'}</div><ol>${L.placed.map((p, wi) => p.dir === d ? `<li data-w="${wi}"><b>${p.num}</b><span>${fmt(p.clue)} <span class="muted small">(${p.word.length})</span></span></li>` : '').join('')}</ol></div>`).join('')}
      </div>
      <div class="row" style="margin-top:22px"><button class="btn primary" id="xcheck">Проверить и сдать</button></div>`;
    el.innerHTML = html;
    el.querySelectorAll('.xc').forEach(d => { cells[d.dataset.key] = {div: d, inp: d.querySelector('input'), w: letterAt[d.dataset.key].w}; });
    let cur = 0;
    const wcells = wi => { const p = L.placed[wi]; return Array.from({length: p.word.length}, (_, k) => (p.r + (p.dir ? k : 0)) + ',' + (p.c + (p.dir ? 0 : k))); };
    const highlight = () => {
      el.querySelectorAll('.xc.hl').forEach(d => d.classList.remove('hl'));
      wcells(cur).forEach(k => cells[k].div.classList.add('hl'));
      el.querySelectorAll('.clues li').forEach(li => li.classList.toggle('on', +li.dataset.w === cur));
    };
    const filled = () => Object.values(cells).filter(c => c.inp.value).length;
    const total = Object.keys(cells).length;
    Object.entries(cells).forEach(([key, cell]) => {
      cell.inp.addEventListener('focus', () => { if (!cell.w.includes(cur)) cur = cell.w[0]; highlight(); });
      cell.inp.addEventListener('click', () => { if (cell.w.length > 1 && document.activeElement === cell.inp && cell._clicked){ cur = cell.w[(cell.w.indexOf(cur) + 1) % cell.w.length]; highlight(); } cell._clicked = true; });
      cell.inp.addEventListener('blur', () => { cell._clicked = false; });
      cell.inp.addEventListener('input', () => {
        const v = cell.inp.value.toUpperCase().replace(/Ё/g, 'Е').replace(/[^A-ZА-Я0-9]/g, '');
        cell.inp.value = v.slice(-1);
        ctx.progress(filled(), total);
        if (cell.inp.value){ const ks = wcells(cur), idx = ks.indexOf(key); if (idx >= 0 && idx < ks.length - 1) cells[ks[idx + 1]].inp.focus(); }
      });
      cell.inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !cell.inp.value){ const ks = wcells(cur), idx = ks.indexOf(key); if (idx > 0){ e.preventDefault(); const p = cells[ks[idx - 1]].inp; p.value = ''; p.focus(); } }
      });
    });
    el.querySelectorAll('.clues li').forEach(li => li.onclick = () => {
      cur = +li.dataset.w; const ks = wcells(cur); const k = ks.find(k => !cells[k].inp.value) || ks[0]; cells[k].inp.focus(); highlight();
    });
    function done(){
      let score = 0; const wrong = [];
      L.placed.forEach((p, wi) => {
        const ok = wcells(wi).every((k, j) => cells[k].inp.value === p.word[j]);
        if (ok) score++; else wrong.push(p);
        el.querySelector(`li[data-w="${wi}"]`).classList.add(ok ? 'ok' : 'no');
      });
      Object.entries(cells).forEach(([k, c]) => { c.inp.disabled = true; c.div.classList.add(c.inp.value === letterAt[k].ch ? 'ok' : 'no'); });
      ctx.finish({score, max: L.placed.length, details: wrong.length ? 'Не отгаданы: ' + wrong.map(p => p.word).join(', ') : 'Все слова верно',
        review: wrong.map(p => `<div><b>${p.num}.</b> ${fmt(p.clue)} — <span style="color:var(--good)">${esc(p.word)}</span></div>`).join('')});
    }
    el.querySelector('#xcheck').onclick = done;
    highlight();
    return {forceFinish: done};
  }
};

/* Генератор кроссворда: слова пересекаются по общим буквам */
function buildCrossword(words){
  const list = words.map(w => ({...w})).sort((a, b) => b.word.length - a.word.length);
  const grid = new Map(); const placed = [];
  const K = (r, c) => r + ',' + c;
  function can(w, r, c, dir){
    const dr = dir ? 1 : 0, dc = dir ? 0 : 1; let inter = 0;
    if (grid.has(K(r - dr, c - dc)) || grid.has(K(r + dr * w.length, c + dc * w.length))) return -1;
    for (let k = 0; k < w.length; k++){
      const rr = r + dr * k, cc = c + dc * k, g = grid.get(K(rr, cc));
      if (g){ if (g.ch !== w[k] || g.dirs.includes(dir)) return -1; inter++; }
      else if (grid.has(K(rr + dc, cc + dr)) || grid.has(K(rr - dc, cc - dr))) return -1;
    }
    return inter;
  }
  function put(item, r, c, dir){
    for (let k = 0; k < item.word.length; k++){
      const key = K(r + (dir ? k : 0), c + (dir ? 0 : k));
      const g = grid.get(key) || {ch: item.word[k], dirs: []}; g.dirs.push(dir); grid.set(key, g);
    }
    placed.push({...item, r, c, dir});
  }
  function bounds(){ let a = 1e9, b = -1e9, x = 1e9, y = -1e9; grid.forEach((v, k) => { const [r, c] = k.split(',').map(Number); a = Math.min(a, r); b = Math.max(b, r); x = Math.min(x, c); y = Math.max(y, c); }); return {r0: a, r1: b, c0: x, c1: y}; }
  if (!list.length) return {placed: [], rows: 0, cols: 0};
  put(list[0], 0, 0, 0);
  let rest = list.slice(1);
  for (let pass = 0; pass < 3 && rest.length; pass++){
    const left = [];
    rest.forEach(item => {
      let best = null; const w = item.word;
      grid.forEach((g, key) => {
        const [cr, cc] = key.split(',').map(Number);
        if (g.dirs.length > 1) return;
        const dir = g.dirs[0] ? 0 : 1;
        for (let k = 0; k < w.length; k++){
          if (w[k] !== g.ch) continue;
          const r = cr - (dir ? k : 0), c = cc - (dir ? 0 : k);
          const inter = can(w, r, c, dir);
          if (inter < 1) continue;
          const b = bounds(); const area = (Math.max(b.r1, r + (dir ? w.length - 1 : 0)) - Math.min(b.r0, r) + 1) * (Math.max(b.c1, c + (dir ? 0 : w.length - 1)) - Math.min(b.c0, c) + 1);
          const s = inter * 1000 - area;
          if (!best || s > best.s) best = {s, r, c, dir};
        }
      });
      if (best) put(item, best.r, best.c, best.dir); else left.push(item);
    });
    rest = left;
  }
  rest.forEach(item => { const b = bounds(); put(item, b.r1 + 2, b.c0, 0); });
  const b = bounds();
  placed.forEach(p => { p.r -= b.r0; p.c -= b.c0; });
  const starts = [...new Set(placed.map(p => p.r * 1000 + p.c))].sort((x, y) => x - y);
  placed.forEach(p => p.num = starts.indexOf(p.r * 1000 + p.c) + 1);
  placed.sort((x, y) => x.num - y.num || x.dir - y.dir);
  return {placed, rows: b.r1 - b.r0 + 1, cols: b.c1 - b.c0 + 1};
}

/* Экран результата */
function showResult(game, res, opts){
  if (opts.onResult) return opts.onResult(res);
  const pct = res.max ? Math.round(res.score * 100 / res.max) : 0;
  const mood = pct >= 90 ? 'Блестяще!' : pct >= 70 ? 'Хорошая работа!' : pct >= 50 ? 'Неплохо, но можно лучше' : 'Стоит повторить тему';
  let xpHtml = '';
  if (!opts.preview && S.data){
    const prev = (S.data.my[game.id] || {}).best || 0, before = xpOf(S.data.my), gain = Math.max(0, pct - prev);
    const m = S.data.my[game.id] || (S.data.my[game.id] = {best: 0, attempts: 0});
    m.best = Math.max(m.best, pct); m.attempts++; m.last = todayStr();
    if (!(S.data.days || []).includes(m.last)) (S.data.days = S.data.days || []).push(m.last);
    setTimeout(checkNewBadges, 600);
    const lb = levelOf(before), la = levelOf(before + gain);
    const cg = Math.floor((before + gain) / 10) - Math.floor(before / 10);
    if (cg && S.data.coins) S.data.coins.balance += cg;
    xpHtml = gain ? `<div><span class="xp-gain">+${gain} опыта</span>${cg ? ` <span class="stakepill p">${COIN}+${cg}</span>` : ''}</div>` : `<div class="small muted" style="margin-top:10px">Опыт растёт, когда вы улучшаете свой лучший результат (сейчас ${prev}%)</div>`;
    if (la.n > lb.n) xpHtml += `<div class="lvlup">Новый уровень! Теперь вы — ${la.name} <b>${la.sym}</b> (№ ${la.n})</div>`;
  }
  const review = res.review ? `<div class="review">${res.review}</div>` : '';
  const html = `
    <div class="wrap narrow">
      <div class="panel" style="text-align:center">
        <div class="row" style="justify-content:center">${tile(game.type)}</div>
        <h2 style="margin-top:14px; font-size:1.1rem">${esc(game.title)}</h2>
        <div class="score" style="color:var(--${pctClass(pct)}); margin-top:14px">${pct}%</div>
        <div style="font-weight:700; font-size:1.1rem; margin-top:6px">${mood}</div>
        <div class="muted small" style="margin-top:4px">Баллы: ${res.score} из ${res.max} · Время: ${fmtSec(res.seconds)}</div>
        ${xpHtml}
        <div id="sendState" class="small" style="margin-top:14px"></div>
      </div>
      ${review ? `<h3 style="margin-top:24px; font-size:1rem">Разбор ошибок</h3>${review}` : ''}
      <div class="row" style="margin-top:20px">
        ${!opts.preview && S.data && S.data.helper ? '<button class="btn big" id="askh">Разобрать с помощником</button>' : ''}
        <button class="btn big" id="again">Ещё раз</button>
        <button class="btn primary big grow" id="back">${opts.preview ? 'Назад в редактор' : 'К заданиям'}</button>
      </div>
    </div>`;
  const prev = app.querySelector('#stage');
  if (game.type === 'cross' && prev){ const box = document.createElement('div'); box.innerHTML = html; prev.prepend(box); }
  else app.innerHTML = html;
  window.scrollTo(0, 0);
  if (pct >= 80){ sfx('win'); confetti(); }
  document.getElementById('again').onclick = () => play(game, opts);
  const ah = document.getElementById('askh');
  if (ah) ah.onclick = () => openHelper('Я решал «' + game.title + '» и получил ' + pct + '%.' + (res.review ? ' Помоги разобраться с ошибками:\n' + stripHtml(res.review).slice(0, 3000) : ' С какими вопросами мне стоит разобраться?'));
  document.getElementById('back').onclick = () => { if (NAV.game && NAV.on && NAV.depth > 0) history.back(); else { NAV.game = null; opts.onExit && opts.onExit(); } };
  const st = document.getElementById('sendState');
  if (opts.preview){ st.innerHTML = '<span class="pill warn">Режим проверки — результат не записан</span>'; return; }
  const send = () => {
    st.innerHTML = '<span class="pill none">Отправляем результат учителю…</span>';
    api('submitResult', {gameId: game.id, student: S.student.name, className: S.student.cls, score: res.score, max: res.max, seconds: res.seconds, details: res.details})
      .then(() => { st.innerHTML = '<span class="pill good">✓ Результат отправлен учителю</span>'; })
      .catch(e => { st.innerHTML = `<span class="pill bad">Не отправлено: ${esc(e.message)}</span> <button class="btn sm" id="resend">Отправить снова</button>`; document.getElementById('resend').onclick = send; });
  };
  send();
}

/* Кэш в двух частях: задания (большие, общие, меняются редко) и данные ученика (маленькие). */
function dataCacheKey(){ return 'chem_d2_' + lc((S.student && (S.student.email || S.student.name)) || '') + '|' + lc(S.student && S.student.cls); }
const CAT_KEY = 'chem_cat2';

function loadDataCache(){
  try {
    try { Object.keys(localStorage).filter(k => k.indexOf('chem_data_') === 0).forEach(k => localStorage.removeItem(k)); } catch(e){}
    const d = JSON.parse(localStorage.getItem(dataCacheKey()) || 'null'), c = JSON.parse(localStorage.getItem(CAT_KEY) || 'null');
    if (!d || !c || !Array.isArray(c.games)) return null;
    d.games = c.games; d.topics = c.topics; d.ver = c.ver; return d;
  } catch(e){ return null; }
}
function saveDataCache(d, catChanged){
  try {
    if (catChanged) localStorage.setItem(CAT_KEY, JSON.stringify({ver: d.ver, games: d.games, topics: d.topics}));
    localStorage.setItem(dataCacheKey(), JSON.stringify(smallData(d)));

}

/* задания предмета: биология — темы из разделов BIO_BRANCHES, химия — всё остальное */
let _sg = {d: null, m: {}};
function subjGames(subj){
  if (_sg.d !== S.data || _sg.g !== S.data.games){
    _sg = {d: S.data, g: S.data.games, m: {}};
    const of = {}; (S.data.topics || []).forEach(t => { of[lc(t.title)] = subjOfSection(t.section); });
    (S.data.games || []).forEach(g => { const k = of[lc(g.topic)] || 'chem'; (_sg.m[k] = _sg.m[k] || []).push(g); });
  }
  return _sg.m[subj] || [];
}
let _cat = {};
function catalog(){
  const ck = S.subject + '|' + S.student.cls;
  if (_cat.d === S.data && _cat.g === S.data.games && _cat.k === ck) return _cat.v;
  const v = catalog_();
  _cat = {d: S.data, g: S.data.games, k: ck, v};
  return v;
}
function catalog_(){
  const subj = S.subject === 'bio' || isAL(S.subject) ? S.subject : 'chem', isBio = subj !== 'chem';
  const topics = S.data.topics.filter(t => subjOfSection(t.section) === subj), games = subjGames(subj), cls = S.student.cls;
  const mine = games.filter(g => !g.className || g.className.toUpperCase().split(/[,\s]+/).includes(cls))
    .sort((a, b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type));
  const key = s => String(s || '').trim().toLowerCase();
  const out = [], used = new Set();
  let n = 0;
  const byTopic = {};
  mine.forEach(g => { const k = key(g.topic); (byTopic[k] = byTopic[k] || []).push(g); });
  topics.forEach(t => {
    n++;
    const gs = byTopic[key(t.title)] || [];
    if (!gs.length) return;
    gs.forEach(g => used.add(g.id));
    let sec = out.find(s => s.section === t.section);
    if (!sec) out.push(sec = {section: t.section, topics: []});
    sec.topics.push({title: t.title, num: n, games: gs});
  });
  const rest = mine.filter(g => !used.has(g.id));
  if (rest.length && !isBio){
    const sec = {section: 'Другие задания', topics: []};
    rest.forEach(g => { const t = g.topic.trim() || 'Без темы'; let tp = sec.topics.find(x => x.title === t); if (!tp) sec.topics.push(tp = {title: t, num: '•', games: []}); tp.games.push(g); });
    out.push(sec);
  }

function dayAdd(d, n){ const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
function todayStr(){ return (S.data && S.data.today) || new Date().toISOString().slice(0, 10); }
function lsKey(k){ return 'chem_' + k + '_' + lc((S.student && (S.student.email || S.student.name)) || ''); }
function lsGet(k, def){ try { const v = JSON.parse(localStorage.getItem(lsKey(k))); return v == null ? def : v; } catch(e){ return def; } }
function lsSet(k, v){ try { localStorage.setItem(lsKey(k), JSON.stringify(v)); } catch(e){} }
function streakInfo(){
  const set = new Set((S.data && S.data.days) || []), today = todayStr();
  let cur = 0, d = set.has(today) ? today : dayAdd(today, -1);
  while (set.has(d)){ cur++; d = dayAdd(d, -1); }
  let best = 0, run = 0, prev = null;
  [...set].sort().forEach(x => { run = prev && dayAdd(prev, 1) === x ? run + 1 : 1; best = Math.max(best, run); prev = x; });

}
function hashStr(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function dailyGame(){
  const today = todayStr(), key = 'daily_' + (S.subject || 'chem');
  const games = subjGames(S.subject === 'bio' || isAL(S.subject) ? S.subject : 'chem'), my = S.data.my;
  let pick = lsGet(key, null);
  if (!pick || pick.date !== today || !games.some(g => g.id === pick.id)){
    if (!games.length) return null;
    let pool = games.filter(g => !my[g.id]);
    if (!pool.length) pool = games.filter(g => (my[g.id].best || 0) < 100);
    if (!pool.length) pool = games;
    pool.sort((a, b) => a.id < b.id ? -1 : 1);
    pick = {date: today, id: pool[hashStr(today + S.student.name + key) % pool.length].id};
    lsSet(key, pick);

  const g = games.find(x => x.id === pick.id);
  const done = !!(g && my[g.id] && my[g.id].last === today);
  if (done){ const ds = lsGet('dailydone', []); if (ds.indexOf(today) < 0){ ds.push(today); lsSet('dailydone', ds.slice(-400)); } }

}

function ptQuiz(){
  const old = document.getElementById('ptsheet'); if (old) old.remove();
  const pool = PT.filter(e => e[0] <= 56 || [78, 79, 80, 82, 92].includes(e[0]));
  const rounds = shuffle(pool).slice(0, 10).map((e, i) => {
    const kind = i % 3, others = shuffle(pool.filter(x => x !== e)).slice(0, 3), opts = shuffle([e, ...others]);
    if (kind === 0) return {q: `Какой символ у элемента «${e[2]}»?`, opts: opts.map(x => x[1]), ok: opts.indexOf(e)};
    if (kind === 1) return {q: `Как называется элемент ${e[1]}?`, opts: opts.map(x => x[2]), ok: opts.indexOf(e)};
    return {q: `Какой элемент стоит под номером ${e[0]}?`, opts: opts.map(x => x[2] + ' (' + x[1] + ')'), ok: opts.indexOf(e)};
  });
  let i = 0, score = 0, lock = false;
  const exit = () => renderPT();
  function show(){
    if (i >= rounds.length){
      const best = Math.max(score, lsGet('ptbest', 0)); lsSet('ptbest', best);
      app.innerHTML = `<div class="wrap narrow"><div class="panel" style="text-align:center">
        <div class="score" style="color:var(--${score >= 8 ? 'good' : score >= 5 ? 'warn' : 'bad'})">${score}/10</div>
        <h2>${score >= 9 ? 'Ты знаток таблицы!' : score >= 6 ? 'Хорошо! Ещё немного практики' : 'Повтори таблицу и попробуй снова'}</h2>
        <p class="muted">Твой рекорд: ${best} из 10</p>
        <div class="row" style="justify-content:center"><button class="btn big" id="pqA">Ещё раз</button><button class="btn primary big" id="pqB">К таблице</button></div></div></div>`;
      if (score >= 8){ confetti(); sfx('win'); }
      checkNewBadges();
      document.getElementById('pqA').onclick = ptQuiz; document.getElementById('pqB').onclick = exit; return;
    }
    const r = rounds[i]; lock = false;
    app.innerHTML = `<div class="bar"><div class="wrap"><div class="row"><button class="btn sm ghost" id="pqX">← Выйти</button><div class="grow" style="font-weight:700">Угадай элемент</div><span class="small muted">${i + 1}/10 · ✓ ${score}</span></div>
      <div class="progress"><span style="width:${i * 10}%"></span></div></div></div>
      <div class="wrap narrow"><div class="panel"><h3 style="margin:0 0 14px">${esc(r.q)}</h3>
      <div class="opts">${r.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'АБВГ'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>
      <div class="tfoot"><div class="row" style="justify-content:center"><button class="btn" id="pqX2">← Выйти</button></div></div></div>`;
    document.getElementById('pqX').onclick = document.getElementById('pqX2').onclick = exit;
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (lock) return; lock = true; const k = +b.dataset.k;
      if (k === r.ok){ score++; b.classList.add('ok'); sfx('good'); } else { b.classList.add('bad'); app.querySelector(`.opt[data-k="${r.ok}"]`).classList.add('ok'); sfx('bad'); }
      setTimeout(() => { i++; show(); }, 900);
    });
  }
  show(); window.scrollTo(0, 0);
}

function duelQuestions(subj){
  const games = subjGames(subj).filter(g => g.type === 'test' || g.type === 'quiz');
  const all = [];
  games.forEach(g => PARSE.quiz(g.source).items.forEach(it => { if (it.options.length >= 2 && it.q.length < 300) all.push(it); }));
  return shuffle(all).slice(0, 10);
}
function duelSource(qs){ return qs.map(it => it.q + '\n' + it.options.map((o, j) => (j === it.correct ? '*' : '') + o).join('\n')).join('\n\n'); }
function duelPlay(title, src, onDone){
  helperFab(false);
  play({id: 'duel', title, type: 'quiz', source: src, timeLimit: 5}, {onExit: () => { helperFab(true); S.view = 'duels'; renderHome(); }, onResult: res => onDone(res)});
}
function duelStart(opp, subj){
  const qs = duelQuestions(subj);
  if (qs.length < 5){ toast('Недостаточно вопросов для дуэли по этому предмету'); return; }
  const src = duelSource(qs);
  navPush();
  duelPlay('Дуэль с ' + opp, src, async res => {
    duelResultScreen('Отправляем вызов…', res);
    /* ставка: монеты переходят, когда соперник сыграет */
    try { await api('duelCreate', S.student.name, S.student.cls, opp, subj, src, res.score, Math.round(res.seconds));
      duelResultScreen(`Вызов отправлен! ${opp} увидит его во вкладке «Дуэли». Результат появится, когда соперник сыграет.`, res); sfx('win');
    } catch (e){ duelResultScreen('Не удалось отправить вызов: ' + String(e.message || e).replace(/^(Exception|Error):\s*/, ''), res); }
  });
}
function duelAccept(d){
  if (!d || !d.questions) return;
  navPush();
  duelPlay('Дуэль с ' + d.from, d.questions, async res => {
    duelResultScreen('Считаем результат…', res);
    try { const r = await api('duelSubmit', S.student.name, S.student.cls, d.id, res.score, Math.round(res.seconds));
      const stk = r.stake || 0;
      if (S.data.coins && stk) S.data.coins.balance += r.winner === 'to' ? stk : -stk;
      const msg = r.winner === 'draw' ? 'Ничья! Одинаковые баллы и время — монеты остаются у всех.' : r.winner === 'to' ? `Победа! Ты обыграл(а) ${d.from} — счёт ${r.s2} : ${r.s1}.${stk ? ' Ты забираешь ' + stk + ' монет!' : ''}` : `${d.from} победил(а) — счёт ${r.s1} : ${r.s2}.${stk ? ' Ты отдаёшь ' + stk + ' монет.' : ''} Вызови на реванш!`;
      duelResultScreen(msg, res, r.winner === 'to'); if (r.winner === 'to'){ S.data.duel = S.data.duel || {}; S.data.duel.wins = (S.data.duel.wins || 0) + 1; checkNewBadges(); }
    } catch (e){ duelResultScreen('Не удалось отправить результат: ' + String(e.message || e).replace(/^(Exception|Error):\s*/, ''), res); }
  });
}
function duelResultScreen(msg, res, won){

/* ================= Аналитика для учителя ================= */
function renderAnalytics(){
  const box = document.getElementById('tbody'), d = T.data, f = T.filter;
  const classes = [...new Set(d.results.map(r => r.className).filter(Boolean))].sort();
  const rs = d.results.filter(r => !f.cls || r.className === f.cls);
  const byGame = {}; d.games.forEach(g => byGame[g.id] = g);
  const now = new Date(), dstr = x => String(x).slice(0, 10);
  const daysAgo = s => Math.floor((now - new Date(dstr(s) + 'T00:00:00')) / 864e5);
  const week = rs.filter(r => daysAgo(r.time) < 7);
  // ученики
  const st = {};
  rs.forEach(r => { const k = lc(r.student) + '|' + lc(r.className); const s = st[k] || (st[k] = {name: r.student, cls: r.className, n: 0, best: {}, last: '', weeks: [0, 0, 0, 0, 0, 0]});
    s.n++; s.best[r.gameId] = Math.max(s.best[r.gameId] || 0, r.percent); if (r.time > s.last) s.last = r.time;
    const w = Math.floor(daysAgo(r.time) / 7); if (w < 6) s.weeks[5 - w]++; });
  const studs = Object.values(st).map(s => ({...s, done: Object.keys(s.best).length, avg: Math.round(Object.values(s.best).reduce((a, b) => a + b, 0) / Math.max(1, Object.keys(s.best).length))}));
  const idle = studs.filter(s => daysAgo(s.last) >= 7).sort((a, b) => a.last.localeCompare(b.last));
  // темы
  const tp = {};
  studs.forEach(s => Object.keys(s.best).forEach(id => { const g = byGame[id]; if (!g) return; const t = g.topic || 'Без темы'; (tp[t] = tp[t] || []).push(s.best[id]); }));
  const topics = Object.keys(tp).map(t => ({t, avg: Math.round(tp[t].reduce((a, b) => a + b, 0) / tp[t].length), n: tp[t].length})).filter(x => x.n >= 2).sort((a, b) => a.avg - b.avg).slice(0, 10);
  // вопросы тестов
  const qs = {}, att = {};
  rs.forEach(r => { const g = byGame[r.gameId]; if (!g || (g.type !== 'test' && g.type !== 'quiz')) return; att[r.gameId] = (att[r.gameId] || 0) + 1;
    const m = String(r.details).match(/:\s*([\d,\s]+)$/); if (!m) return;
    [...new Set(m[1].split(',').map(x => parseInt(x, 10)).filter(Boolean))].forEach(n => { const k = r.gameId + '#' + n; qs[k] = (qs[k] || 0) + 1; }); });
  const hard = Object.keys(qs).map(k => { const [id, n] = k.split('#'); const g = byGame[id]; const it = g ? PARSE.quiz(g.source).items[n - 1] : null;
    return it ? {g, it, pct: Math.min(100, Math.round(qs[k] * 100 / att[id])), wrong: qs[k], att: att[id]} : null; }).filter(x => x && x.att >= 2).sort((a, b) => b.pct - a.pct || b.wrong - a.wrong).slice(0, 10);
  const avgAll = studs.length ? Math.round(studs.reduce((a, s) => a + s.avg, 0) / studs.length) : 0;
  const spark = w => { const mx = Math.max(1, ...w); return `<span class="spark">${w.map(x => `<i style="height:${Math.round(x * 100 / mx)}%" title="${x}"></i>`).join('')}</span>`; };
  box.innerHTML = `<div class="row" style="margin-bottom:14px"><select class="field" id="anCls" style="max-width:220px"><option value="">Все классы</option>${classes.map(c => `<option ${f.cls === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="ankpi"><div><b>${studs.length}</b><span>учеников</span></div><div><b>${new Set(week.map(r => lc(r.student))).size}</b><span>занимались за 7 дней</span></div><div><b>${week.length}</b><span>попыток за неделю</span></div><div><b>${avgAll}%</b><span>средний результат</span></div></div>
    <div class="angrid">
      <div class="panel"><h3>Трудные темы</h3><p class="small muted">Средний лучший результат учеников по теме</p>
        ${topics.length ? topics.map(x => `<div class="anbar"><span>${esc(x.t)}</span><div><i style="width:${x.avg}%; background:var(--${x.avg >= 70 ? 'good' : x.avg >= 50 ? 'warn' : 'bad'})"></i></div><b>${x.avg}%</b></div>`).join('') : '<div class="small muted">Мало данных</div>'}</div>
      <div class="panel"><h3>Давно не заходили</h3><p class="small muted">Больше 7 дней без заданий</p>
        ${idle.length ? idle.slice(0, 15).map(s => `<div class="anrow"><span>${esc(s.name)} <span class="muted small">${esc(s.cls)}</span></span><span class="pill bad">${daysAgo(s.last)} дн.</span></div>`).join('') : '<div class="small" style="color:var(--good)">Все занимались на этой неделе</div>'}</div>
    </div>
    <div class="panel" style="margin-top:14px"><h3>Самые трудные вопросы</h3><p class="small muted">Доля попыток, где ученики ошиблись в этом вопросе</p>
      ${hard.length ? hard.map(x => `<div class="anq"><span class="pill ${x.pct >= 60 ? 'bad' : 'warn'}">${x.pct}%</span><div><b>${fmt(x.it.q)}</b><div class="small muted">Верно: ${fmt(x.it.options[x.it.correct])} · ${esc(x.g.title)} · ошибок ${x.wrong} из ${x.att}</div></div></div>`).join('') : '<div class="small muted">Пока мало результатов тестов</div>'}</div>
    <div class="panel" style="margin-top:14px; overflow-x:auto"><h3>Ученики</h3>
      <table><thead><tr><th>Ученик</th><th>Класс</th><th>Заданий</th><th>Средний</th><th>Активность (6 нед.)</th><th>Последний раз</th></tr></thead>
      <tbody>${studs.sort((a, b) => b.avg - a.avg).map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.cls)}</td><td>${s.done}</td><td><span class="pill ${pctClass(s.avg)}">${s.avg}%</span></td><td>${spark(s.weeks)}</td><td class="num">${esc(dstr(s.last))}</td></tr>`).join('')}</tbody></table></div>`;
  document.getElementById('anCls').onchange = e => { f.cls = e.target.value; renderAnalytics(); };
}

function coinsPanelHtml(){
  if (!S.data || !S.data.coins) return '';
  const bal = coinBal(), prizes = (S.data.prizes || []).slice().sort((a, b) => a.cost - b.cost), hist = S.data.coins.history || [];
  return `<div class="panel coinp"><div class="row" style="justify-content:space-between; align-items:center">
      <div><div class="small" style="font-weight:700; opacity:.8">МОИ МОНЕТЫ</div><div class="big">${COIN}${bal}</div></div>
      <div class="small" style="max-width:24ch; opacity:.85">1 монета за каждые 10 очков опыта + победы в дуэлях. Копи и обменивай у учителя на призы!</div></div></div>
    <h2 style="margin-top:20px">Призы</h2>
    ${prizes.length ? prizes.map(p => { const ok = bal >= p.cost; return `<div class="prize ${ok ? 'ok' : ''}"><div class="grow"><b>${esc(p.name)}</b>
        <div class="small ${ok ? '' : 'muted'}" style="${ok ? 'color:var(--good); font-weight:700' : ''}">${ok ? 'Хватает монет — попроси учителя обменять!' : 'Ещё ' + (p.cost - bal) + ' монет'}</div>
        <div class="bar2"><span style="width:${Math.min(100, Math.round(bal * 100 / p.cost))}%"></span></div></div><span class="pc">${COIN}${p.cost}</span></div>`; }).join('')
      : '<div class="empty panel">Учитель ещё не добавил призы. Копи монеты — они пригодятся!</div>'}
    ${hist.length ? `<h2 style="margin-top:20px">История монет</h2><div class="panel">${hist.map(h => `<div class="chist"><span>${esc(h.reason)} <span class="muted small">${esc(String(h.time).slice(0, 10))}</span></span><b class="${h.delta > 0 ? 'p' : 'm'}">${h.delta > 0 ? '+' : ''}${h.delta}</b></div>`).join('')}</div>` : ''}`;
}
/* Учитель: сообщения учеников */
async function renderMailAdmin(){
  const box = document.getElementById('tbody');
  box.innerHTML = '<div class="loading" style="min-height:120px">Загружаем сообщения…</div>';
  let list; try { list = await api('teacherFeedback', T.pw); } catch (e){ box.innerHTML = `<div class="panel">Ошибка: ${esc(e.message)}</div>`; return; }
  const f = T.mailF || 'new', shown = list.filter(m => f === 'all' || !m.reply);
  const nNew = list.filter(m => !m.reply).length;
  if (T.data) T.data.mailNew = nNew;
  box.innerHTML = `<div class="row" style="justify-content:space-between; margin-bottom:6px"><div class="rseg"><button data-f="new" class="${f === 'new' ? 'on' : ''}">Без ответа (${nNew})</button><button data-f="all" class="${f === 'all' ? 'on' : ''}">Все (${list.length})</button></div>
      <span class="small muted">Все сообщения хранятся в листе «Сообщения» Google-таблицы</span></div>
    ${shown.length ? shown.map(m => `<div class="msg ${m.reply ? '' : 'unans'}" data-id="${esc(m.id)}"><div class="mh"><span><b>${esc(m.student)}</b> · ${esc(m.cls)} · ${esc(m.kind)}</span><span>${esc(m.time)}</span></div>
        <div class="mt">${esc(m.text)}</div>
        ${m.reply ? `<div class="mr"><b>Ваш ответ · ${esc(m.replyTime)}${m.seen ? ' · прочитан' : ''}</b>${esc(m.reply)}</div>` : ''}
        <div class="row" style="gap:8px; margin-top:10px; align-items:flex-end"><textarea class="field grow" rows="2" maxlength="1500" placeholder="${m.reply ? 'Изменить ответ…' : 'Ответить ученику…'}" style="min-width:200px"></textarea>
          <button class="btn primary sm" data-a="reply">Ответить</button><button class="btn ghost sm" data-a="del">Удалить</button></div></div>`).join('')
      : `<div class="empty panel">${f === 'new' ? 'Все сообщения отвечены' : 'Пока никто не писал.'}</div>`}`;
  box.querySelectorAll('.rseg button').forEach(b => b.onclick = () => { T.mailF = b.dataset.f; renderMailAdmin(); });
  box.querySelectorAll('.msg button').forEach(b => b.onclick = async () => {
    const card = b.closest('.msg'), id = card.dataset.id;
    if (b.dataset.a === 'reply'){
      const t = card.querySelector('textarea').value.trim(); if (!t){ toast('Напишите ответ'); return; }
      b.disabled = true;
      try { await api('replyFeedback', T.pw, id, t); toast('Ответ отправлен — ученик увидит его в приложении'); renderMailAdmin(); } catch (e){ toast(String(e.message || e)); b.disabled = false; }
    } else {
      if (b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = 'Точно удалить?'; setTimeout(() => { if (b.isConnected){ b.dataset.armed = ''; b.textContent = 'Удалить'; } }, 3000); return; }
      b.disabled = true;
      try { await api('deleteFeedback', T.pw, id); toast('Удалено'); renderMailAdmin(); } catch (e){ toast(String(e.message || e)); b.disabled = false; }
    }
  });
}
/* Учитель: монеты и призы */
async function renderCoinsAdmin(){
  const box = document.getElementById('tbody');
  box.innerHTML = '<div class="loading" style="min-height:120px">Загружаем монеты…</div>';
  let d; try { d = T.coins = await api('teacherCoins', T.pw); } catch (e){ box.innerHTML = `<div class="panel">Ошибка: ${esc(e.message)}</div>`; return; }
  const f = T.filter, classes = [...new Set(d.students.map(x => x.cls).filter(Boolean))].sort();
  const list = d.students.filter(x => !f.cls || x.cls === f.cls);
  const prizeOpts = d.prizes.map((p, i) => `<option value="${i}">${esc(p.name)} — ${p.cost}</option>`).join('');
  box.innerHTML = `<div class="angrid" style="margin-top:0">
      <div class="panel"><h3>Призы</h3><p class="small muted">Каждая строка: «Название = цена в монетах». Ученики видят этот список в «Наградах».</p>
        <textarea class="field" id="przT" rows="7" style="width:100%; font-family:inherit">${esc(d.prizes.map(p => p.name + ' = ' + p.cost).join('\n'))}</textarea>
        <div class="row" style="margin-top:8px"><button class="btn primary" id="przS">Сохранить призы</button><span class="small muted">Пример: Пятёрка за домашку = 150</span></div></div>
      <div class="panel"><h3>Как считаются монеты</h3><p class="small">1 монета за каждые 10 очков опыта (лучшие проценты по заданиям). Победа в дуэли забирает у проигравшего ${(S.data && S.data.stake) || 10} монет. Когда выдаёте приз — монеты списываются. Все движения видны в листе «Монеты» Google-таблицы.</p>
        ${d.log.length ? `<h3 style="margin-top:10px">Последние операции</h3>${d.log.slice(0, 8).map(l => `<div class="chist"><span>${esc(l.student)} · ${esc(l.reason)}</span><b class="${l.delta > 0 ? 'p' : 'm'}">${l.delta > 0 ? '+' : ''}${l.delta}</b></div>`).join('')}` : ''}</div>
    </div>
    <div class="panel" style="margin-top:14px; overflow-x:auto"><div class="row" style="justify-content:space-between"><h3>Монеты учеников</h3>
      <select class="field" id="coCls" style="max-width:200px"><option value="">Все классы</option>${classes.map(c => `<option ${f.cls === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
      <table class="ctbl"><thead><tr><th>Ученик</th><th>Класс</th><th>Монеты</th><th>Выдать приз</th><th>Бонус / штраф</th></tr></thead><tbody>
      ${list.map((x, i) => `<tr data-i="${d.students.indexOf(x)}"><td>${esc(x.name)}</td><td>${esc(x.cls)}</td><td><b>${x.balance}</b></td>
        <td>${d.prizes.length ? `<div class="row" style="gap:6px; flex-wrap:nowrap"><select class="field pz">${prizeOpts}</select><button class="btn sm" data-a="prize">Выдать</button></div>` : '<span class="small muted">нет призов</span>'}</td>
        <td><div class="row" style="gap:6px; flex-wrap:nowrap"><input class="field am" type="number" placeholder="+20 / −10" style="width:100px"><button class="btn sm ghost" data-a="adj">OK</button></div></td></tr>`).join('')}
      </tbody></table></div>`;
  document.getElementById('coCls').onchange = e => { f.cls = e.target.value; renderCoinsAdmin(); };
  document.getElementById('przS').onclick = async () => {
    const lines = document.getElementById('przT').value.split('\n').map(l => l.trim()).filter(Boolean);
    const list = lines.map(l => { const k = l.lastIndexOf('='); return {name: (k > 0 ? l.slice(0, k) : l).trim(), cost: k > 0 ? parseInt(l.slice(k + 1), 10) : 0}; }).filter(p => p.name && p.cost > 0);
    try { await api('savePrizes', T.pw, list); toast('Призы сохранены: ' + list.length); renderCoinsAdmin(); } catch (e){ toast(String(e.message || e)); }
  };
  box.querySelectorAll('tr[data-i] button').forEach(b => b.onclick = async () => {
    const tr = b.closest('tr'), st = d.students[+tr.dataset.i];
    let delta, reason;
    if (b.dataset.a === 'prize'){ const p = d.prizes[+tr.querySelector('.pz').value]; delta = -p.cost; reason = 'Приз: ' + p.name; }
    else { delta = parseInt(tr.querySelector('.am').value, 10); reason = delta > 0 ? 'Бонус от учителя' : 'Штраф'; if (!delta){ toast('Впишите число монет'); return; } }
    if (b.dataset.armed !== '1'){ b.dataset.armed = '1'; const t = b.textContent; b.textContent = (delta > 0 ? '+' : '') + delta + '?'; setTimeout(() => { if (b.isConnected){ b.dataset.armed = ''; b.textContent = t; } }, 3000); return; }
    b.disabled = true;
    try { const r = await api('teacherCoinsChange', T.pw, st.name, st.cls, delta, reason); toast(`${st.name}: теперь ${r.balance} монет`); renderCoinsAdmin(); }
    catch (e){ toast(String(e.message || e).replace(/^(Exception|Error):\s*/, '')); b.disabled = false; }
  });
}
