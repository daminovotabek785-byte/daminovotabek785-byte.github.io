<!DOCTYPE html>
<html lang="ru">
<head>
<title>Ramossitto</title>
<meta name="theme-color" content="#4338F0">
<meta name="description" content="Тесты и игры по химии">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ramossitto">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="config.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: universal-indicator pH strip as the brand rainbow; element tiles for games and levels. One column on phones, two on desktop. */
:root{
  --bg:#F3F5FC; --surface:#FFFFFF; --sunk:#E9ECF7; --ink:#14173A; --muted:#5B6185; --line:#DADEF0;
  --accent:#4338F0; --accent-ink:#FFFFFF; --accent-deep:#2A20B8;
  --good:#11994B; --bad:#E0353A; --warn:#D98200;
  --good-bg:#DDF6E7; --bad-bg:#FDE3E3; --warn-bg:#FFF0D6;
  --t-test:#7B2FF7; --t-quiz:#F07F0A; --t-match:#0B94D1; --t-build:#139E4A; --t-cross:#E2336B;
  --hero:#171A45; --hero-ink:#FFFFFF; --hero-muted:#B9BEF0;
  --ph:linear-gradient(90deg,#E2336B,#F07F0A,#F2BE00,#139E4A,#0B94D1,#4338F0,#7B2FF7);
  --f-display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C0E22; --surface:#161937; --sunk:#1F2348; --ink:#ECEEFF; --muted:#9DA3CC; --line:#2C3160;
    --accent:#7C74FF; --accent-ink:#0C0E22; --accent-deep:#4B42D6;
    --good:#3DDC84; --bad:#FF6B6E; --warn:#FFB23F;
    --good-bg:#14372A; --bad-bg:#43191F; --warn-bg:#3D2C10;
    --t-test:#A884FF; --t-quiz:#FFA448; --t-match:#45C2F5; --t-build:#4FD17E; --t-cross:#FF6E9A;
    --hero:#1C1F55; --hero-ink:#FFFFFF; --hero-muted:#B9BEF0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:16px/1.5 var(--f-body); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.2}
sub,sup{font-size:.7em; line-height:0}
.wrap{max-width:1040px; margin:0 auto; padding:24px 16px 64px}
.narrow{max-width:460px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.grow{flex:1; min-width:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.hidden{display:none!important}

/* Buttons & inputs */
.btn{border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:10px 16px; font-weight:600; cursor:pointer; display:inline-flex; gap:8px; align-items:center; justify-content:center; text-decoration:none; transition:transform .08s, background .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); box-shadow:0 3px 0 var(--accent-deep)}
.btn.primary:active{transform:translateY(3px); box-shadow:none}
.btn.big{padding:14px 22px; font-size:1.05rem; border-radius:14px}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent; border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px; font-size:.875rem}
.btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,.field:focus-visible,.opt:focus-visible,.card:focus-visible,.chip:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.field{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:11px 12px; font-size:16px}
.field:focus{border-color:var(--accent); outline:none}
textarea.field{min-height:260px; font-family:var(--f-mono); font-size:14px; line-height:1.6; resize:vertical}
.fgroup{display:grid; gap:6px}
.fgrid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* Brand */
.brand{display:flex; gap:12px; align-items:center}
.brand h1{font-family:var(--f-display); font-size:1.25rem; font-weight:700}
.brand .el{width:44px; height:44px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-family:var(--f-display); font-weight:700; position:relative; flex:none}
.brand .el i{position:absolute; top:2px; left:4px; font-style:normal; font-size:8px; line-height:1; font-family:var(--f-mono)}

.authtabs{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:5px; border-radius:14px; background:var(--surface); border:1px solid var(--line)}
.authtabs button{border:0; background:transparent; padding:10px; border-radius:10px; font-weight:700; color:var(--muted); cursor:pointer; font-size:15px}
.authtabs button.on{background:var(--accent); color:#fff}
/* Помощник */
.fab{position:fixed; right:16px; bottom:16px; z-index:15; display:flex; align-items:center; gap:8px; padding:12px 16px 12px 12px; border-radius:999px; border:0; background:var(--accent); color:#fff; font-weight:700; font-size:15px; box-shadow:0 10px 26px -8px var(--accent); cursor:pointer}
.fab .av{width:40px; height:40px; border-radius:50%; background:#fff; display:grid; place-items:center; overflow:hidden; margin:-6px 0 -6px -4px}
.fab .av svg{width:100%; height:100%}
.chat .hav{width:46px; height:46px; border-radius:50%; background:#fff; overflow:hidden; display:grid; place-items:center; flex:none}
.chat .hav svg{width:100%; height:100%}
.mini-hi{align-self:center; width:120px; height:132px; margin:4px 0 -4px}
.mini-hi svg{width:100%; height:100%}
.chat header h2 small{display:block; font:500 12px var(--f-body, inherit); opacity:.75; margin-top:2px}
.chat{position:fixed; inset:0; z-index:30; background:rgba(10,12,40,.45); display:flex; justify-content:flex-end}
.chat .sheet{width:min(460px,100%); height:100%; background:var(--bg); display:flex; flex-direction:column; box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.chat header{display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--hero); color:var(--hero-ink)}
.chat header h2{font:700 1.05rem var(--f-display); margin:0; flex:1}
.chat header .x{border:0; background:rgba(255,255,255,.15); color:inherit; width:36px; height:36px; border-radius:10px; font-size:20px; cursor:pointer}
.chat .msgs{flex:1; overflow-y:auto; padding:14px 14px 4px; display:flex; flex-direction:column; gap:10px}
.msg{max-width:88%; padding:10px 13px; border-radius:14px; line-height:1.45; font-size:15px; white-space:normal; overflow-wrap:anywhere}
.msg.u{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px}
.msg.m{align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:4px}
.msg img{display:block; max-width:100%; border-radius:10px; margin-bottom:6px}
.msg.wait{display:flex; align-items:center; gap:10px; padding:6px 12px 6px 6px}
.msg.wait .th{width:54px; height:54px; border-radius:50%; background:#fff; overflow:hidden; flex:none; animation:thk 1.4s ease-in-out infinite alternate; transform-origin:50% 90%}
.msg.wait .th svg{width:100%; height:100%}
.msg.wait .th .hand{animation:scr .5s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:80% 100%}
.msg.wait .th .q{animation:qq 1.4s ease-in-out infinite}
.msg.wait .dots{display:flex; gap:5px}
.msg.wait .dots i{width:8px; height:8px; border-radius:50%; background:var(--muted); opacity:.35; animation:dd 1.2s infinite}
.msg.wait .dots i:nth-child(2){animation-delay:.2s} .msg.wait .dots i:nth-child(3){animation-delay:.4s}
@keyframes thk{from{transform:rotate(-6deg)} to{transform:rotate(6deg)}}
@keyframes scr{from{transform:translateY(0)} to{transform:translateY(-3px) rotate(-6deg)}}
@keyframes qq{0%,100%{opacity:0} 50%{opacity:1}}
@keyframes dd{0%,100%{opacity:.25; transform:translateY(0)} 50%{opacity:1; transform:translateY(-4px)}}
.msg .retry{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.chat .who{display:flex; gap:6px; padding:8px 14px 0}
.chat .who button{flex:1; display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); background:var(--surface); border-radius:14px; padding:5px 10px 5px 5px; font-weight:700; font-size:14px; color:var(--ink); cursor:pointer}
.chat .who button.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--surface))}
.chat .who .h{width:34px; height:34px; border-radius:50%; background:#fff; overflow:hidden; flex:none; border:1px solid var(--line)}
.chat .who .h svg{width:100%; height:100%}
.fab .av + .av{margin-left:-18px; box-shadow:0 0 0 2px var(--accent)}
@media (prefers-reduced-motion: reduce){ .msg.wait .th, .msg.wait .th .hand, .msg.wait .dots i, .msg.wait .th .q{animation:none} }
.chat .quick{display:flex; gap:6px; flex-wrap:wrap; padding:6px 14px}
.chat .quick button{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink)}
.chat form{display:flex; gap:8px; align-items:flex-end; padding:10px 14px 16px; border-top:1px solid var(--line); background:var(--surface)}
.chat textarea{flex:1; resize:none; max-height:140px; min-height:44px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; font-size:16px; background:var(--bg); color:var(--ink)}
.chat .ib{width:44px; height:44px; flex:none; border-radius:12px; border:1px solid var(--line); background:var(--bg); cursor:pointer; display:grid; place-items:center; color:var(--ink)}
.chat .ib.send{background:var(--accent); border-color:var(--accent); color:#fff}
.chat .pv{padding:0 14px; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.chat .pv img{height:48px; border-radius:8px}
body:has(.fab) .wrap{padding-bottom:90px}
/* Выбор предмета */
.subj-hero{position:relative; overflow:hidden; border-radius:24px; padding:26px 20px 22px; margin-top:14px; background:radial-gradient(120% 90% at 0% 0%, #2B1F7A 0%, #171A45 55%, #0B3B2E 100%); color:#fff}
.subj-hero h2{font:700 1.6rem/1.15 var(--f-display); margin:0; position:relative}
.subj-hero p{margin:8px 0 0; opacity:.8; position:relative; max-width:34ch}
.subj-hero .deco{position:absolute; inset:0; pointer-events:none; opacity:.22}
.subjects{display:grid; gap:16px; margin-top:16px; grid-template-columns:1fr}
@media (min-width:760px){ .subjects{grid-template-columns:1fr 1fr} }
.subj{position:relative; overflow:hidden; border:0; border-radius:24px; min-height:210px; padding:22px; text-align:left; color:#fff; cursor:pointer; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; box-shadow:0 18px 40px -22px var(--sc); transition:transform .15s, box-shadow .15s; animation:rise .45s both}
.subj:hover{transform:translateY(-4px)}
.subj:focus-visible{outline:3px solid var(--sc); outline-offset:3px}
.subj.chem{--sc:#5B3BF0; background:linear-gradient(135deg,#4338F0 0%,#7B2FF7 60%,#B44CF0 100%)}
.subj.bio{--sc:#13A06B; background:linear-gradient(135deg,#0E9F6E 0%,#22C55E 60%,#84CC16 100%); animation-delay:.08s}
.subj .art{position:absolute; right:-10px; top:-6px; width:62%; max-width:260px; opacity:.95; pointer-events:none}
.subj h3{font:700 1.7rem/1 var(--f-display); margin:0; position:relative}
.subj .sub{position:relative; opacity:.9; font-size:.95rem; max-width:24ch}
.subj .go{position:relative; margin-top:10px; align-self:flex-start; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:8px 16px; font-weight:700; font-size:.95rem; backdrop-filter:blur(4px)}
.subj .soon{position:absolute; right:18px; top:18px; background:#FFD447; color:#5A4300; font-weight:800; font-size:.8rem; padding:5px 12px; border-radius:999px; letter-spacing:.02em}
.subj-page{position:relative}
.subj-page::before{content:""; position:fixed; inset:0; z-index:-1; background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22240%22%20height%3D%22240%22%20viewBox%3D%220%200%20240%20240%22%20fill%3D%22none%22%20stroke%3D%22%236D5BF5%22%20stroke-opacity%3D%22.13%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M30%2020l18%2010v20L30%2060%2012%2050V30z%22/%3E%3Cpath%20d%3D%22M48%2030l18-10%2018%2010v20L66%2060%22/%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%22150%22%20r%3D%227%22/%3E%3Ccircle%20cx%3D%2266%22%20cy%3D%22136%22%20r%3D%225%22/%3E%3Cpath%20d%3D%22M46%20146l15-7%22/%3E%3Cpath%20d%3D%22M150%2020h18M154%2020v26l-18%2034a8%208%200%200%200%207%2012h30a8%208%200%200%200%207-12l-18-34V20%22/%3E%3Cg%20stroke%3D%22%2316A34A%22%20stroke-opacity%3D%22.15%22%3E%3Cpath%20d%3D%22M180%20120c18%2014%2018%2028%200%2042s-18%2028%200%2042%22/%3E%3Cpath%20d%3D%22M204%20120c-18%2014-18%2028%200%2042s18%2028%200%2042%22/%3E%3Cpath%20d%3D%22M185%20133h14M185%20175h14%22/%3E%3Cpath%20d%3D%22M90%20200c0-22%2016-36%2036-38%202%2020-14%2038-36%2038z%22/%3E%3Cellipse%20cx%3D%22110%22%20cy%3D%2290%22%20rx%3D%2218%22%20ry%3D%2213%22/%3E%3Ccircle%20cx%3D%22113%22%20cy%3D%2289%22%20r%3D%224%22/%3E%3C/g%3E%3C/svg%3E") repeat, var(--bg)}
@media (max-width:600px){ .subj .art{width:48%; right:-14px; top:auto; bottom:-8px; opacity:.55} .subj .sub{max-width:26ch} .subj{min-height:190px} }
.subj h3,.subj .sub,.subj .go{z-index:1}
.bio-soon{text-align:center; padding:28px 20px}
.bio-soon svg{width:180px; height:auto}
/* Element tile */
.tile{--tc:var(--accent); width:64px; height:72px; flex:none; border-radius:12px; border:2px solid var(--tc); background:color-mix(in srgb, var(--tc) 12%, var(--surface)); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:0 2px 7px; overflow:hidden; color:var(--tc)}
.tile i{position:absolute; top:3px; left:5px; font-style:normal; font:500 10px/1 var(--f-mono)}
.tile b{font:700 21px/1 var(--f-display); white-space:nowrap}
.tile small{font-size:7.5px; line-height:1.1; margin-top:4px; text-transform:uppercase; letter-spacing:0; font-weight:700; text-align:center; max-width:100%; overflow-wrap:normal}

/* Cards */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px}
.list{display:grid; gap:10px}
.card{display:flex; gap:16px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; cursor:pointer; text-align:left; width:100%; transition:border-color .15s, transform .15s, box-shadow .15s; animation:rise .35s both}
.card:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 22px -12px var(--accent)}
.grid2{display:grid; gap:12px; grid-template-columns:1fr}
@media (min-width:760px){ .grid2{grid-template-columns:1fr 1fr} }
.card h3{font-size:1.05rem; font-weight:600}
.meta{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.85rem; color:var(--muted); margin-top:4px}
.pill{display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 10px; font-size:.8rem; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums}
.pill.good{background:var(--good-bg); color:var(--good)}
.pill.bad{background:var(--bad-bg); color:var(--bad)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.none{background:var(--sunk); color:var(--muted)}

/* Play */
.bar{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line)}
.bar .wrap{padding-top:10px; padding-bottom:10px}
.timer{font:500 1rem var(--f-mono); font-variant-numeric:tabular-nums; padding:4px 10px; border-radius:8px; background:var(--sunk)}
.timer.low{background:var(--bad-bg); color:var(--bad)}
.progress{height:4px; background:var(--sunk); border-radius:4px; overflow:hidden; margin-top:8px}
.progress span{display:block; height:100%; background:var(--ph); background-size:1040px 100%; transition:width .3s}
.q-text{font-size:clamp(1.25rem,4vw,1.6rem); font-weight:600; margin:8px 0 22px}
.opts{display:grid; gap:10px}
.opt{display:flex; gap:12px; align-items:center; text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:14px; cursor:pointer; font-size:1.05rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:30px; height:30px; flex:none; border-radius:7px; background:var(--sunk); display:grid; place-items:center; font-weight:700; font-size:.9rem}
.opt.good{border-color:var(--good); background:var(--good-bg)}
.opt.bad{border-color:var(--bad); background:var(--bad-bg)}
.feedback{min-height:28px; margin-top:14px; font-weight:600}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}

/* Hero, levels, nav, rating */
.hero{position:relative; overflow:hidden; background:var(--hero); color:var(--hero-ink); border-radius:24px; padding:22px 22px 26px; margin-top:16px}
.hero::before{content:""; position:absolute; inset:-40% -10% auto auto; width:320px; height:320px; border-radius:50%; background:radial-gradient(circle, rgba(123,47,247,.55), transparent 65%); pointer-events:none}
.hero::after{content:""; position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--ph)}
.hero > *{position:relative}
.hero h1{font:700 clamp(1.3rem,4.5vw,1.9rem)/1.15 var(--f-display)}
.hero .muted{color:var(--hero-muted)}
.lvl{width:92px; height:104px; flex:none; padding:0 4px 12px; justify-content:flex-end !important; overflow:hidden; border-radius:14px; background:linear-gradient(160deg,#FFFFFF,#E6E4FF); color:#2A20B8; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 0 0 3px rgba(255,255,255,.15), 0 10px 30px -8px rgba(124,116,255,.8); animation:float 4s ease-in-out infinite}
.lvl i{position:absolute; top:6px; left:8px; font:500 13px var(--f-mono); font-style:normal}
.lvl b{font:700 36px/1 var(--f-display)}
.lvl small{font-size:11px; font-weight:700; margin-top:6px; text-align:center; max-width:100%; line-height:1.1}
.xpbar{height:12px; border-radius:12px; background:rgba(255,255,255,.14); overflow:hidden; margin-top:8px}
.xpbar span{display:block; height:100%; background:var(--ph); background-size:400px 100%; border-radius:12px; transition:width .6s}
.hstats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px}
.hstats div{background:rgba(255,255,255,.08); border-radius:14px; padding:10px 12px}
.hstats b{display:block; font:700 1.25rem var(--f-display); font-variant-numeric:tabular-nums}
.hstats span{font-size:.75rem; color:var(--hero-muted)}
.nav{display:flex; gap:6px; margin:18px 0 6px; background:var(--sunk); padding:5px; border-radius:16px}
.nav button{flex:1; border:0; background:transparent; padding:10px 8px; border-radius:12px; font-weight:700; cursor:pointer; color:var(--muted)}
.nav button.on{background:var(--surface); color:var(--accent); box-shadow:0 2px 6px rgba(20,23,58,.08)}
.rank{display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 14px; animation:rise .35s both}
.rank.me{border:2px solid var(--accent)}
.medal{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font:700 .9rem var(--f-display); background:var(--sunk); color:var(--muted); flex:none}
.medal.m1{background:#FFD54A; color:#5A4200} .medal.m2{background:#D6DBE6; color:#3B4255} .medal.m3{background:#E9A36A; color:#4A2508}
.mini{width:34px; height:38px; flex:none; border-radius:7px; border:2px solid var(--accent); color:var(--accent); display:grid; place-items:center; font:700 .95rem var(--f-display)}

const PARSE = {
  quiz(src){
    const items = [], errors = [];
    String(src || '').replace(/\r/g, '').split(/\n\s*\n/).forEach((block, bi) => {
      const lines = block.split('\n').map(s => s.trim()).filter(Boolean);
      if (!lines.length) return;
      const q = lines[0], opts = [], n = items.length + errors.length + 1;
      let correct = -1;
      lines.slice(1).forEach(l => { if (l[0] === '*'){ if (correct < 0) correct = opts.length; opts.push(l.slice(1).trim()); } else opts.push(l); });
      if (opts.length < 2) errors.push(`Вопрос ${n} («${q.slice(0, 30)}»): нужно минимум 2 варианта ответа`);
      else if (correct < 0) errors.push(`Вопрос ${n} («${q.slice(0, 30)}»): отметьте правильный ответ звёздочкой *`);
      else items.push({q, options: opts, correct});
    });
    return {items, errors, label: n => plural(n, 'вопрос', 'вопроса', 'вопросов')};
  },
  test(src){ return PARSE.quiz(src); },
  match(src){
    const items = [], errors = [];
    String(src || '').replace(/\r/g, '').split('\n').forEach((l, i) => {
      l = l.trim(); if (!l) return;
      const k = l.indexOf('=');
      if (k < 1 || !l.slice(k + 1).trim()) { errors.push(`Строка ${i + 1}: нужен формат «А = Б»`); return; }
      items.push({a: l.slice(0, k).trim(), b: l.slice(k + 1).trim()});
    });
    if (items.length > 15) errors.push('Больше 15 пар — на телефоне будет тесно. Лучше разбейте на две игры.');
    return {items, errors, label: n => plural(n, 'пара', 'пары', 'пар')};
  },
  build(src){
    const items = [], errors = [];
    String(src || '').replace(/\r/g, '').split('\n').forEach((l, i) => {
      l = l.trim(); if (!l) return;
      const k = l.indexOf('=');
      if (k < 1) { errors.push(`Строка ${i + 1}: нужен формат «Задание = части ответа»`); return; }
      const rest = l.slice(k + 1).split('||');
      const tokens = rest[0].trim().split(/\s+/).filter(Boolean);
      const extra = (rest[1] || '').trim().split(/\s+/).filter(Boolean);
      if (tokens.length < 2) { errors.push(`Строка ${i + 1}: в ответе должно быть минимум 2 части через пробел`); return; }
      items.push({prompt: l.slice(0, k).trim(), tokens, extra});
    });
    return {items, errors, label: n => plural(n, 'задание', 'задания', 'заданий')};
  },
  cross(src){
    const items = [], errors = [];
    String(src || '').replace(/\r/g, '').split('\n').forEach((l, i) => {
      l = l.trim(); if (!l) return;
      const k = l.indexOf('=');
      if (k < 1) { errors.push(`Строка ${i + 1}: нужен формат «СЛОВО = подсказка»`); return; }
      const word = l.slice(0, k).trim().toUpperCase().replace(/Ё/g, 'Е').replace(/[\s\-]/g, '');
      if (!/^[A-ZА-Я0-9]{2,}$/.test(word)) { errors.push(`Строка ${i + 1}: слово «${l.slice(0, k).trim()}» должно состоять только из букв`); return; }
      items.push({word, clue: l.slice(k + 1).trim()});
    });
    if (items.length > 20) errors.push('Больше 20 слов — кроссворд выйдет огромным.');
    return {items, errors, label: n => plural(n, 'слово', 'слова', 'слов')};
  }
};

}

      for (let j = checked ? i + 1 : i; j < tasks.length; j++){ wrongN.push(j + 1); review.push({p: tasks[j].prompt, given: '— не успели', right: tasks[j].tokens.join(' ')}); }
      done();
    }};
  },

  cross(el, words, ctx){
    const L = buildCrossword(words);
    const cs = Math.max(26, Math.min(40, Math.floor((Math.min(window.innerWidth, 880) - 40) / L.cols) - 2));
    const cells = {}; // "r,c" -> {inp, words:[wi...]}
    let html = `<div class="label">Кроссворд</div><p class="small muted" style="margin:4px 0 14px">Нажмите на клетку или подсказку и вводите буквы. Когда закончите — «Проверить и сдать».</p>
      <div class="xwrap"><div class="xgrid" style="--cs:${cs}px; grid-template-columns:repeat(${L.cols}, var(--cs))">`;
    const letterAt = {};
    L.placed.forEach((p, wi) => { for (let k = 0; k < p.word.length; k++){ const r = p.r + (p.dir ? k : 0), c = p.c + (p.dir ? 0 : k), key = r + ',' + c; (letterAt[key] = letterAt[key] || {ch: p.word[k], w: []}).w.push(wi); } });
    const numAt = {}; L.placed.forEach(p => numAt[p.r + ',' + p.c] = p.num);
    for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++){
      const key = r + ',' + c;
      html += letterAt[key] ? `<div class="xc" data-key="${key}">${numAt[key] ? `<i>${numAt[key]}</i>` : ''}<input maxlength="2" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Клетка"></div>` : '<div></div>';
    }
    html += `</div></div><div class="clues">
      ${[0, 1].map(d => `<div><div class="label">${d ? 'По вертикали ↓' : 'По горизонтали →'}</div><ol>${L.placed.map((p, wi) => p.dir === d ? `<li data-w="${wi}"><b>${p.num}</b><span>${fmt(p.clue)} <span class="muted small">(${p.word.length})</span></span></li>` : '').join('')}</ol></div>`).join('')}
      </div>
      <div class="row" style="margin-top:22px"><button class="btn primary" id="xcheck">Проверить и сдать</button></div>`;
    el.innerHTML = html;
    el.querySelectorAll('.xc').forEach(d => { cells[d.dataset.key] = {div: d, inp: d.querySelector('input'), w: letterAt[d.dataset.key].w}; });
    let cur = 0;
    const wcells = wi => { const p = L.placed[wi]; return Array.from({length: p.word.length}, (_, k) => (p.r + (p.dir ? k : 0)) + ',' + (p.c + (p.dir ? 0 : k))); };
    const highlight = () => {
      el.querySelectorAll('.xc.hl').forEach(d => d.classList.remove('hl'));
      wcells(cur).forEach(k => cells[k].div.classList.add('hl'));
      el.querySelectorAll('.clues li').forEach(li => li.classList.toggle('on', +li.dataset.w === cur));
    };
    const filled = () => Object.values(cells).filter(c => c.inp.value).length;
    const total = Object.keys(cells).length;
    Object.entries(cells).forEach(([key, cell]) => {
      cell.inp.addEventListener('focus', () => { if (!cell.w.includes(cur)) cur = cell.w[0]; highlight(); });
      cell.inp.addEventListener('click', () => { if (cell.w.length > 1 && document.activeElement === cell.inp && cell._clicked){ cur = cell.w[(cell.w.indexOf(cur) + 1) % cell.w.length]; highlight(); } cell._clicked = true; });
      cell.inp.addEventListener('blur', () => { cell._clicked = false; });
      cell.inp.addEventListener('input', () => {
        const v = cell.inp.value.toUpperCase().replace(/Ё/g, 'Е').replace(/[^A-ZА-Я0-9]/g, '');
        cell.inp.value = v.slice(-1);
        ctx.progress(filled(), total);
        if (cell.inp.value){ const ks = wcells(cur), idx = ks.indexOf(key); if (idx >= 0 && idx < ks.length - 1) cells[ks[idx + 1]].inp.focus(); }
      });
      cell.inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !cell.inp.value){ const ks = wcells(cur), idx = ks.indexOf(key); if (idx > 0){ e.preventDefault(); const p = cells[ks[idx - 1]].inp; p.value = ''; p.focus(); } }
      });
    });
    el.querySelectorAll('.clues li').forEach(li => li.onclick = () => {
      cur = +li.dataset.w; const ks = wcells(cur); const k = ks.find(k => !cells[k].inp.value) || ks[0]; cells[k].inp.focus(); highlight();
    });
    function done(){
      let score = 0; const wrong = [];
      L.placed.forEach((p, wi) => {
        const ok = wcells(wi).every((k, j) => cells[k].inp.value === p.word[j]);
        if (ok) score++; else wrong.push(p);
        el.querySelector(`li[data-w="${wi}"]`).classList.add(ok ? 'ok' : 'no');
      });
      Object.entries(cells).forEach(([k, c]) => { c.inp.disabled = true; c.div.classList.add(c.inp.value === letterAt[k].ch ? 'ok' : 'no'); });
      ctx.finish({score, max: L.placed.length, details: wrong.length ? 'Не отгаданы: ' + wrong.map(p => p.word).join(', ') : 'Все слова верно',
        review: wrong.map(p => `<div><b>${p.num}.</b> ${fmt(p.clue)} — <span style="color:var(--good)">${esc(p.word)}</span></div>`).join('')});
    }
    el.querySelector('#xcheck').onclick = done;
    highlight();
    return {forceFinish: done};
  }
};

/* Генератор кроссворда: слова пересекаются по общим буквам */
function buildCrossword(words){
  const list = words.map(w => ({...w})).sort((a, b) => b.word.length - a.word.length);
  const grid = new Map(); const placed = [];
  const K = (r, c) => r + ',' + c;
  function can(w, r, c, dir){
    const dr = dir ? 1 : 0, dc = dir ? 0 : 1; let inter = 0;
    if (grid.has(K(r - dr, c - dc)) || grid.has(K(r + dr * w.length, c + dc * w.length))) return -1;
    for (let k = 0; k < w.length; k++){
      const rr = r + dr * k, cc = c + dc * k, g = grid.get(K(rr, cc));
      if (g){ if (g.ch !== w[k] || g.dirs.includes(dir)) return -1; inter++; }
      else if (grid.has(K(rr + dc, cc + dr)) || grid.has(K(rr - dc, cc - dr))) return -1;
    }
    return inter;
  }
  function put(item, r, c, dir){
    for (let k = 0; k < item.word.length; k++){
      const key = K(r + (dir ? k : 0), c + (dir ? 0 : k));
      const g = grid.get(key) || {ch: item.word[k], dirs: []}; g.dirs.push(dir); grid.set(key, g);
    }
    placed.push({...item, r, c, dir});
  }
  function bounds(){ let a = 1e9, b = -1e9, x = 1e9, y = -1e9; grid.forEach((v, k) => { const [r, c] = k.split(',').map(Number); a = Math.min(a, r); b = Math.max(b, r); x = Math.min(x, c); y = Math.max(y, c); }); return {r0: a, r1: b, c0: x, c1: y}; }
  if (!list.length) return {placed: [], rows: 0, cols: 0};
  put(list[0], 0, 0, 0);
  let rest = list.slice(1);
  for (let pass = 0; pass < 3 && rest.length; pass++){
    const left = [];
    rest.forEach(item => {
      let best = null; const w = item.word;
      grid.forEach((g, key) => {
        const [cr, cc] = key.split(',').map(Number);
        if (g.dirs.length > 1) return;
        const dir = g.dirs[0] ? 0 : 1;
        for (let k = 0; k < w.length; k++){
          if (w[k] !== g.ch) continue;
          const r = cr - (dir ? k : 0), c = cc - (dir ? 0 : k);
          const inter = can(w, r, c, dir);
          if (inter < 1) continue;
          const b = bounds(); const area = (Math.max(b.r1, r + (dir ? w.length - 1 : 0)) - Math.min(b.r0, r) + 1) * (Math.max(b.c1, c + (dir ? 0 : w.length - 1)) - Math.min(b.c0, c) + 1);
          const s = inter * 1000 - area;
          if (!best || s > best.s) best = {s, r, c, dir};
        }
      });
      if (best) put(item, best.r, best.c, best.dir); else left.push(item);
    });
    rest = left;
  }
  rest.forEach(item => { const b = bounds(); put(item, b.r1 + 2, b.c0, 0); });
  const b = bounds();
  placed.forEach(p => { p.r -= b.r0; p.c -= b.c0; });
  const starts = [...new Set(placed.map(p => p.r * 1000 + p.c))].sort((x, y) => x - y);
  placed.forEach(p => p.num = starts.indexOf(p.r * 1000 + p.c) + 1);
  placed.sort((x, y) => x.num - y.num || x.dir - y.dir);
  return {placed, rows: b.r1 - b.r0 + 1, cols: b.c1 - b.c0 + 1};
}

/* Экран результата */
function showResult(game, res, opts){
  const pct = res.max ? Math.round(res.score * 100 / res.max) : 0;
  const mood = pct >= 90 ? 'Блестяще!' : pct >= 70 ? 'Хорошая работа!' : pct >= 50 ? 'Неплохо, но можно лучше' : 'Стоит повторить тему';
  let xpHtml = '';
  if (!opts.preview && S.data){
    const prev = (S.data.my[game.id] || {}).best || 0, before = xpOf(S.data.my), gain = Math.max(0, pct - prev);
    const m = S.data.my[game.id] || (S.data.my[game.id] = {best: 0, attempts: 0});
    m.best = Math.max(m.best, pct); m.attempts++;
    const lb = levelOf(before), la = levelOf(before + gain);
    xpHtml = gain ? `<div><span class="xp-gain">+${gain} опыта</span></div>` : `<div class="small muted" style="margin-top:10px">Опыт растёт, когда вы улучшаете свой лучший результат (сейчас ${prev}%)</div>`;
    if (la.n > lb.n) xpHtml += `<div class="lvlup">Новый уровень! Теперь вы — ${la.name} <b>${la.sym}</b> (№ ${la.n})</div>`;
  }
  const review = res.review ? `<div class="review">${res.review}</div>` : '';
  const html = `
    <div class="wrap narrow">
      <div class="panel" style="text-align:center">
        <div class="row" style="justify-content:center">${tile(game.type)}</div>
        <h2 style="margin-top:14px; font-size:1.1rem">${esc(game.title)}</h2>
        <div class="score" style="color:var(--${pctClass(pct)}); margin-top:14px">${pct}%</div>
        <div style="font-weight:700; font-size:1.1rem; margin-top:6px">${mood}</div>
        <div class="muted small" style="margin-top:4px">Баллы: ${res.score} из ${res.max} · Время: ${fmtSec(res.seconds)}</div>
        ${xpHtml}
        <div id="sendState" class="small" style="margin-top:14px"></div>
      </div>
      ${review ? `<h3 style="margin-top:24px; font-size:1rem">Разбор ошибок</h3>${review}` : ''}
      <div class="row" style="margin-top:20px">
        ${!opts.preview && S.data && S.data.helper ? '<button class="btn big" id="askh">Разобрать с помощником</button>' : ''}
        <button class="btn big" id="again">Ещё раз</button>
        <button class="btn primary big grow" id="back">${opts.preview ? 'Назад в редактор' : 'К заданиям'}</button>
      </div>
    </div>`;
  const prev = app.querySelector('#stage');
  if (game.type === 'cross' && prev){ const box = document.createElement('div'); box.innerHTML = html; prev.prepend(box); }
  else app.innerHTML = html;
  window.scrollTo(0, 0);
  if (pct >= 80){ sfx('win'); confetti(); }
  document.getElementById('again').onclick = () => play(game, opts);
  const ah = document.getElementById('askh');
  if (ah) ah.onclick = () => openHelper('Я решал «' + game.title + '» и получил ' + pct + '%.' + (res.review ? ' Помоги разобраться с ошибками:\n' + stripHtml(res.review).slice(0, 3000) : ' С какими вопросами мне стоит разобраться?'));
  document.getElementById('back').onclick = () => { if (NAV.game && NAV.on && NAV.depth > 0) history.back(); else { NAV.game = null; opts.onExit && opts.onExit(); } };
  const st = document.getElementById('sendState');
  if (opts.preview){ st.innerHTML = '<span class="pill warn">Режим проверки — результат не записан</span>'; return; }
  const send = () => {
    st.innerHTML = '<span class="pill none">Отправляем результат учителю…</span>';
    api('submitResult', {gameId: game.id, student: S.student.name, className: S.student.cls, score: res.score, max: res.max, seconds: res.seconds, details: res.details})
      .then(() => { st.innerHTML = '<span class="pill good">✓ Результат отправлен учителю</span>'; })
      .catch(e => { st.innerHTML = `<span class="pill bad">Не отправлено: ${esc(e.message)}</span> <button class="btn sm" id="resend">Отправить снова</button>`; document.getElementById('resend').onclick = send; });
  };
  send();
}

function mdLite(t){
  t = String(t).replace(/\$([^$\n]{1,80})\$/g, (m, x) => x.replace(/\\cdot/g, '·').replace(/\\times/g, '×').replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '$1/$2').replace(/_\{?(\d+)\}?/g, (q, d) => d.replace(/\d/g, c => '₀₁₂₃₄₅₆₇₈₉'[c])).replace(/\^\{?([0-9+\-]+)\}?/g, (q, d) => d.replace(/[0-9+\-]/g, c => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(c)] || (c === '+' ? '⁺' : '⁻'))).replace(/[{}\\]/g, ''));
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^\s*[\*\-]\s+/gm, '• ').replace(/\n/g, '<br>');
}

function helperSwitch(who, carry){
  if (!HELPERS_UI[who] || (who === H.who && !carry)) return;
  if (H.busy) { toast('Подожди, помощник ещё отвечает'); return; }
  helperSave(); H.who = who; try { localStorage.setItem('chem_helper', who); } catch(e){}
  helperLoad(); helperRender();
  if (carry){ const ta = document.getElementById('ht'); if (ta){ ta.value = carry; helperSend(); } }
}
function helperRender(){
  const m = document.getElementById('hm'); if (!m) return;
  const P = HELPERS_UI[H.who], other = H.who === 'mini' ? 'toir' : 'mini';
  document.getElementById('hav').innerHTML = P.head();

  document.querySelectorAll('.chat .who button').forEach(b => b.classList.toggle('on', b.dataset.who === H.who));
  const hello = `<div class="mini-hi">${P.full()}</div><div class="msg m">${esc(P.hello(S.student.name.split(' ')[1] || S.student.name))}</div>`;
  const lastQ = [...H.msgs].reverse().find(x => x.role === 'user');
  m.innerHTML = hello + H.msgs.map((x, i) => `<div class="msg ${x.role === 'user' ? 'u' : 'm'}">${x.img ? `<img src="${x.img}" alt="">` : ''}${mdLite(x.text)}${x.err && i === H.msgs.length - 1 && lastQ ? `<div class="retry"><button class="btn sm" data-retry="1">Повторить</button><button class="btn sm" data-ask="${other}">Спросить ${esc(HELPERS_UI[other].name)}</button></div>` : ''}</div>`).join('')
    + (H.busy ? `<div class="msg m wait" aria-label="${esc(P.name)} думает"><span class="th">${P.think()}</span><span class="dots"><i></i><i></i><i></i></span></div>` : '');
  const rt = m.querySelector('[data-retry]');
  if (rt) rt.onclick = () => { H.msgs.pop(); const q = H.msgs.pop(); const ta = document.getElementById('ht'); ta.value = q.text; H.img = q.img || null; helperSend(); };
  const ak = m.querySelector('[data-ask]');
  if (ak) ak.onclick = () => { const q = lastQ.text; H.msgs.pop(); helperSave(); helperSwitch(ak.dataset.ask, q); };
  m.scrollTop = m.scrollHeight;
  const pv = document.getElementById('hpv');
  pv.innerHTML = H.img ? `<img src="${H.img}" alt=""> Фото прикреплено <button class="btn sm ghost" id="hrm">Убрать</button>` : '';
  if (H.img) document.getElementById('hrm').onclick = () => { H.img = null; helperRender(); };
}
function helperPhoto(file){
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      H.img = c.toDataURL('image/jpeg', 0.8); helperRender();
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}
async function helperSend(){
  const ta = document.getElementById('ht'); if (!ta || H.busy) return;
  const text = ta.value.trim();
  if (!text && !H.img){ toast('Напишите вопрос или прикрепите фото'); return; }
  const img = H.img;
  H.msgs.push({role: 'user', text: text || 'Помоги с задачей на фото', img: img}); H.img = null; ta.value = ''; ta.style.height = '';
  H.busy = true; helperRender();
  const who = H.who, msgs = H.msgs;
  try {
    const res = await Promise.race([
      api('askHelper', S.student.name, S.student.cls, msgs.filter(m => !m.err).map(m => ({role: m.role, text: m.text})), img ? img.split(',')[1] : '', who),
      new Promise((_, rej) => setTimeout(() => rej(new Error('Ответ задерживается — нажми «Повторить» или спроси другого помощника')), 75000))
    ]);
    msgs.push({role: 'model', text: res.text});
  } catch (e){
    msgs.push({role: 'model', err: true, text: 'Не получилось: ' + String(e && e.message || e).replace(/^(Exception|Error):\s*/, '')});
  }
  H.busy = false;
  if (H.who === who){ helperSave(); helperRender(); }
}
function stripHtml(h){ const d = document.createElement('div'); d.innerHTML = h; return (d.innerText || d.textContent || '').replace(/\n{3,}/g, '\n\n').trim(); }

const TYPE_ORDER = ['test', 'quiz', 'match', 'build', 'cross'];
/* Три главных раздела. В каталоге тем учитель пишет: # Общая химия, # Органическая химия, # Неорганическая химия */
const CHEM_BRANCHES = [
  {name: 'Общая химия', n: 1, sym: 'H', el: 'Водород', color: 'var(--t-match)', desc: 'Атом и периодический закон, химическая связь, моль, скорость реакций, растворы'},
  {name: 'Органическая химия', n: 6, sym: 'C', el: 'Углерод', color: 'var(--t-build)', desc: 'Углеводороды, спирты, альдегиды, кислоты, жиры, углеводы, белки, полимеры'},
  {name: 'Неорганическая химия', n: 26, sym: 'Fe', el: 'Железо', color: 'var(--t-quiz)', desc: 'Металлы и неметаллы, оксиды, кислоты, основания, соли, генетическая связь'}
];
const lc = s => String(s || '').trim().toLowerCase();
/* Биология: # Ботаника, # Зоология, # Анатомия человека, # Общая биология */
const BIO_BRANCHES = [
  {name: 'Ботаника', n: 1, sym: 'Bt', el: 'Растения', color: '#16A34A', desc: 'Клетка и ткани растений, корень, побег, лист, цветок, плоды, водоросли, мхи, папоротники, грибы'},
  {name: 'Зоология', n: 2, sym: 'Zo', el: 'Животные', color: '#D97706', desc: 'Простейшие, черви, моллюски, членистоногие, рыбы, земноводные, пресмыкающиеся, птицы, млекопитающие'},
  {name: 'Анатомия человека', n: 3, sym: 'An', el: 'Человек', color: '#E0475B', desc: 'Ткани, ОДС, кровь, кровеносная и дыхательная системы, пищеварение, кожа, выделение, нервная система'},
  {name: 'Общая биология', n: 4, sym: 'Gb', el: 'Клетка, гены', color: '#0D9488', desc: 'Клетка, обмен веществ, деление, генетика, селекция, эволюция, экология и биосфера'}
];
const BIO_SET = new Set(BIO_BRANCHES.map(b => b.name.toLowerCase()));
const curBranches = () => S.subject === 'bio' ? BIO_BRANCHES : CHEM_BRANCHES;
const branchOf = name => curBranches().find(b => lc(b.name) === lc(name));
/* задания предмета: биология — темы из разделов BIO_BRANCHES, химия — всё остальное */
function subjGames(subj){
  const bio = new Set((S.data.topics || []).filter(t => BIO_SET.has(lc(t.section))).map(t => lc(t.title)));
  return (S.data.games || []).filter(g => bio.has(lc(g.topic)) === (subj === 'bio'));
}
function catalog(){
  const isBio = S.subject === 'bio';
  const topics = S.data.topics.filter(t => BIO_SET.has(lc(t.section)) === isBio), games = subjGames(isBio ? 'bio' : 'chem'), cls = S.student.cls;
  const mine = games.filter(g => !g.className || g.className.toUpperCase().split(/[,\s]+/).includes(cls))
    .sort((a, b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type));
  const key = s => String(s || '').trim().toLowerCase();
  const out = [], used = new Set();
  let n = 0;
  topics.forEach(t => {
    n++;
    const gs = mine.filter(g => key(g.topic) === key(t.title));
    if (!gs.length) return;
    gs.forEach(g => used.add(g.id));
    let sec = out.find(s => s.section === t.section);
    if (!sec) out.push(sec = {section: t.section, topics: []});
    sec.topics.push({title: t.title, num: n, games: gs});
  });
  const rest = mine.filter(g => !used.has(g.id));
  if (rest.length && !isBio){
    const sec = {section: 'Другие задания', topics: []};
    rest.forEach(g => { const t = g.topic.trim() || 'Без темы'; let tp = sec.topics.find(x => x.title === t); if (!tp) sec.topics.push(tp = {title: t, num: '•', games: []}); tp.games.push(g); });
    out.push(sec);
  }
  return out;
}

function topicCards(topics, my){
  return topics.map((t, i) => {

        <div class="bar2"><span style="width:${Math.round(d * 100 / t.games.length)}%"></span></div></div>
      ${test && my[test.id] ? `<span class="pill ${pctClass(my[test.id].best)}">тест ${my[test.id].best}%</span>` : ''}
    </button>`; }).join('');
}

async function teacherLoad(){
  app.innerHTML = '<div class="loading">Загрузка…</div>';
  try { T.data = await api('teacherData', T.pw); sstore('chem_pw', T.pw); teacherHome(); }
  catch (e){ sstore('chem_pw', null); teacherLogin(e.message); }
}

function teacherHome(){
  const d = T.data;
  const studentUrl = IN_GAS ? (d.url || '(ссылка появится после публикации)') : location.href.split(/[?#]/)[0];
  app.innerHTML = `<div class="wrap">
    <div class="row" style="justify-content:space-between">
      <div class="brand"><span class="el"><i>7</i>N</span><h1>Панель учителя</h1></div>
      <div class="row"><button class="btn sm" id="refresh">Обновить</button><button class="btn sm ghost" id="logout">Выйти</button></div>
    </div>
    <div class="panel" style="margin-top:18px; padding:14px 16px">
      <div class="label" style="margin-bottom:6px">Ссылка для учеников</div>
      <div class="linkbox"><input class="field" id="slink" readonly value="${esc(studentUrl)}"><button class="btn" id="copy">Копировать</button></div>
    </div>
    <div class="panel" style="margin-top:12px; padding:14px 16px">
      <div class="label" style="margin-bottom:6px">Помощник mini-Ramossitto (Google Gemini) — ${d.helper ? '<span class="pill good">включён</span>' : '<span class="pill warn">выключен</span>'}</div>
      <div class="linkbox"><input class="field" id="gkey" type="password" autocomplete="off" placeholder="${d.helper ? 'Ключ сохранён. Вставьте новый, чтобы заменить' : 'Вставьте ключ из aistudio.google.com/apikey'}"><button class="btn" id="gsave">Сохранить</button>${d.helper ? '<button class="btn ghost" id="goff">Выключить</button>' : ''}</div>
      <div class="small muted" style="margin-top:6px">Ключ хранится только на вашем Google-сервере. Ученики его не видят.</div>
    </div>
    <div class="row" style="justify-content:space-between; margin:22px 0 16px">
      <div class="tabs"><button data-t="games" class="${T.tab === 'games' ? 'on' : ''}">Задания (${d.games.length})</button><button data-t="topics" class="${T.tab === 'topics' ? 'on' : ''}">Темы (${(d.topics || []).length})</button><button data-t="results" class="${T.tab === 'results' ? 'on' : ''}">Результаты (${d.results.length})</button></div>
      ${T.tab === 'games' ? '<button class="btn primary" id="new">+ Новое задание</button>' : ''}
    </div>
    <div id="tbody"></div></div>`;
  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { T.tab = b.dataset.t; teacherHome(); });
  document.getElementById('refresh').onclick = teacherLoad;
  const saveKey = async k => { try { const r = await api('setHelperKey', T.pw, k); T.data.helper = r.enabled; toast(r.enabled ? 'Помощник включён' : 'Помощник выключен'); teacherHome(); } catch (e){ toast(String(e.message || e).replace(/^(Exception|Error):\s*/, '')); } };
  document.getElementById('gsave').onclick = () => { const k = document.getElementById('gkey').value.trim(); if (!k){ toast('Вставьте ключ'); return; } saveKey(k); };
  const goff = document.getElementById('goff'); if (goff) goff.onclick = () => saveKey('');
  document.getElementById('logout').onclick = () => { sstore('chem_pw', null); T.pw = null; teacherLogin(); };
  document.getElementById('copy').onclick = () => {
    const inp = document.getElementById('slink');
    const fallback = () => { inp.select(); try { document.execCommand('copy'); toast('Ссылка скопирована'); } catch (e){ toast('Выделите ссылку и скопируйте вручную'); } };
    if (navigator.clipboard) navigator.clipboard.writeText(inp.value).then(() => toast('Ссылка скопирована'), fallback); else fallback();
  };
  if (T.tab === 'games'){ document.getElementById('new').onclick = () => editor(null); renderGames(); }
  else if (T.tab === 'topics') renderTopics();
  else renderResults();
}

function renderTopics(){
  const box = document.getElementById('tbody'), d = T.data;
  let text = '', sec = null;
  (d.topics || []).forEach(t => { if (t.section !== sec){ sec = t.section; if (sec) text += (text ? '\n' : '') + '# ' + sec + '\n'; } text += t.title + '\n'; });
  box.innerHTML = `<div class="panel" style="display:grid; gap:12px">
    <div class="hint"><b>Каталог тем.</b> У учеников три раздела: <b>Общая химия</b>, <b>Органическая химия</b>, <b>Неорганическая химия</b>. Строка с # — раздел, ниже — его темы, по одной на строку. Порядок здесь — порядок у учеников. В задании указывайте тему точно так же, как она записана здесь.
      <pre># Общая химия\nСтроение атома\nХимическая связь\n# Органическая химия\nАлканы\n# Неорганическая химия\nКислоты</pre>
      <button class="btn sm" id="tp-tpl" style="margin-top:8px">Добавить три раздела</button></div>
    <label class="label" for="tp-src">Темы</label>
    <textarea class="field" id="tp-src" spellcheck="false" style="min-height:340px">${esc(text)}</textarea>
    <div class="parse" id="tp-info"></div>
    <div class="row"><span class="grow"></span><button class="btn primary" id="tp-save">Сохранить каталог</button></div></div>`;
  const ta = document.getElementById('tp-src');
  const parse = () => { const out = []; let section = ''; ta.value.split('\n').forEach(l => { l = l.trim(); if (!l) return; if (l[0] === '#') section = l.replace(/^#+/, '').trim(); else out.push({section, title: l}); }); return out; };
  const info = () => {
    const list = parse(), names = new Set(list.map(t => t.title.toLowerCase()));
    const orphan = [...new Set(d.games.map(g => g.topic.trim()).filter(t => t && !names.has(t.toLowerCase())))];
    const noGames = list.filter(t => !d.games.some(g => g.topic.trim().toLowerCase() === t.title.toLowerCase())).length;
    document.getElementById('tp-info').innerHTML = `<span style="color:var(--good); font-weight:600">✓ ${plural(list.length, 'тема', 'темы', 'тем')}</span><span class="muted"> · без заданий: ${noGames}</span>` +
      (orphan.length ? `<div class="err">• Есть задания с темами не из каталога: ${orphan.map(esc).join(', ')}</div>` : '');
  };
  ta.addEventListener('input', info); info();
  document.getElementById('tp-tpl').onclick = () => {
    const have = new Set(ta.value.split('\n').filter(l => l.trim()[0] === '#').map(l => lc(l.replace(/^\s*#+/, ''))));
    const add = CHEM_BRANCHES.filter(b => !have.has(lc(b.name))).map(b => '# ' + b.name).join('\n\n');
    if (!add){ toast('Все три раздела уже есть'); return; }
    ta.value = (ta.value.trim() ? ta.value.trim() + '\n\n' : '') + add + '\n'; info(); toast('Разделы добавлены. Впишите темы под каждым и сохраните');
  };
  document.getElementById('tp-save').onclick = async e => {
    e.target.disabled = true;
    try { d.topics = await api('saveTopics', T.pw, parse()); toast('Каталог сохранён'); teacherHome(); }
    catch (err){ toast(err.message); e.target.disabled = false; }
  };
}

function renderGames(){
  const box = document.getElementById('tbody'), d = T.data;
  if (!d.games.length){ box.innerHTML = '<div class="empty panel">Заданий пока нет. Нажмите «+ Новое задание».</div>'; return; }
  const counts = {}; d.results.forEach(r => { (counts[r.gameId] = counts[r.gameId] || new Set()).add((r.student + '|' + r.className).toLowerCase()); });
  box.innerHTML = `<div class="list">${d.games.map((g, i) => {
    const p = PARSE[g.type](g.source), n = counts[g.id] ? counts[g.id].size : 0;
    return `<div class="trow" data-id="${esc(g.id)}">${tile(g.type, i + 1)}
      <div class="grow" style="min-width:180px"><h3 style="font-size:1.05rem; font-weight:600">${esc(g.title)}</h3>
        <div class="meta">${g.topic ? `<span>${esc(g.topic)}</span>` : ''}<span>${p.label(p.items.length)}</span>${g.className ? `<span>Классы: ${esc(g.className)}</span>` : '<span>Все классы</span>'}${g.timeLimit ? `<span>⏱ ${g.timeLimit} мин</span>` : ''}${g.deadline ? `<span>${deadlineText(g.deadline)}</span>` : ''}<span>Прошли: ${plural(n, 'ученик', 'ученика', 'учеников')}</span></div></div>
      <label class="row small" style="gap:8px" title="Видна ли игра ученикам"><span class="switch"><input type="checkbox" class="act" ${g.active ? 'checked' : ''} aria-label="Показывать ученикам"><span></span></span>${g.active ? 'Видна' : 'Скрыта'}</label>
      <div class="row" style="gap:6px"><button class="btn sm" data-a="try">Попробовать</button><button class="btn sm" data-a="edit">Изменить</button><button class="btn sm danger" data-a="del">Удалить</button></div>
    </div>`; }).join('')}</div>`;
  box.querySelectorAll('.trow').forEach(row => {
    const g = d.games.find(x => x.id === row.dataset.id);
    row.querySelector('[data-a="edit"]').onclick = () => editor(g);
    row.querySelector('[data-a="try"]').onclick = () => play(g, {preview: true, onExit: teacherHome});
    const del = row.querySelector('[data-a="del"]'); let armed = false;
    del.onclick = async () => {
      if (!armed){ armed = true; del.textContent = 'Точно удалить?'; setTimeout(() => { armed = false; if (del.isConnected) del.textContent = 'Удалить'; }, 3000); return; }
      del.disabled = true;
      try { d.games = await api('deleteGame', T.pw, g.id); toast('Игра удалена'); teacherHome(); } catch (e){ toast(e.message); del.disabled = false; }
    };
    row.querySelector('.act').onchange = async e => {
      e.target.disabled = true;
      try { d.games = await api('saveGame', T.pw, {...g, active: e.target.checked}); toast(e.target.checked ? 'Игра видна ученикам' : 'Игра скрыта'); teacherHome(); }
      catch (err){ toast(err.message); e.target.checked = !e.target.checked; e.target.disabled = false; }
    };
  });
}

function editor(g){
  const isNew = !g || !g.id;
  const st = g ? {...g} : {title: '', topic: '', type: 'test', source: '', timeLimit: 0, deadline: '', className: '', active: true, count: 0};
  const topicOpts = (T.data.topics || []).map(t => `<option value="${esc(t.title)}">${esc(t.section)}</option>`).join('');
  app.innerHTML = `<div class="wrap">
    <div class="row" style="justify-content:space-between; margin-bottom:18px">
      <button class="btn sm ghost" id="cancel">← Назад</button>
      <h1 style="font-family:var(--f-display); font-size:1.2rem">${isNew ? 'Новое задание' : 'Изменить задание'}</h1><span></span>
    </div>
    <div style="display:grid; gap:18px">
      <div class="panel" style="display:grid; gap:14px">
        <div class="fgroup"><span class="label">Тип задания</span><div class="seg" id="seg">${Object.keys(TYPES).map(k => `<button type="button" data-k="${k}" class="${st.type === k ? 'on' : ''}">${tile(k)}<span>${TYPES[k].name}</span></button>`).join('')}</div></div>
        <div class="fgrid">
          <div class="fgroup" style="grid-column:1/-1"><label class="label" for="e-title">Название</label><input class="field" id="e-title" maxlength="80" placeholder="Например: Классы неорганических веществ" value="${esc(st.title)}"></div>
          <div class="fgroup"><label class="label" for="e-topic">Тема из каталога</label><input class="field" id="e-topic" list="topics-dl" maxlength="120" placeholder="Начните вводить название темы" value="${esc(st.topic)}"><datalist id="topics-dl">${topicOpts}</datalist></div>
          <div class="fgroup"><label class="label" for="e-cls">Для классов</label><input class="field" id="e-cls" maxlength="60" placeholder="9А, 9Б (пусто — всем)" value="${esc(st.className)}"></div>
          <div class="fgroup"><label class="label" for="e-time">Время, минут</label><input class="field" id="e-time" type="number" min="0" max="120" value="${st.timeLimit || 0}"><span class="small muted">0 — без ограничения</span></div>
          <div class="fgroup" id="cnt-box"><label class="label" for="e-cnt">Вопросов ученику</label><input class="field" id="e-cnt" type="number" min="0" max="200" value="${st.count || 0}"><span class="small muted">Случайные из банка. 0 — все</span></div>
          <div class="fgroup"><label class="label" for="e-dl">Сдать до</label><input class="field" id="e-dl" type="date" value="${esc(st.deadline)}"></div>
        </div>
        <label class="row small"><span class="switch"><input type="checkbox" id="e-act" ${st.active ? 'checked' : ''}><span></span></span>Показывать ученикам сразу после сохранения</label>
      </div>
      <div class="panel" style="display:grid; gap:12px">
        <div class="hint" id="hint"></div>
        <label class="label" for="e-src">Задания</label>
        <textarea class="field" id="e-src" spellcheck="false">${esc(st.source)}</textarea>
        <div class="parse" id="parse"></div>
      </div>
      <div class="row"><button class="btn" id="try">Попробовать как ученик</button><span class="grow"></span><button class="btn primary" id="save">Сохранить</button></div>
    </div></div>`;
  const src = document.getElementById('e-src');
  function readForm(){
    return {...st, title: document.getElementById('e-title').value, topic: document.getElementById('e-topic').value,
      className: document.getElementById('e-cls').value.toUpperCase().replace(/\s+/g, ' ').trim(),
      timeLimit: Math.max(0, Math.min(120, parseInt(document.getElementById('e-time').value, 10) || 0)),
      count: Math.max(0, parseInt(document.getElementById('e-cnt').value, 10) || 0),
      deadline: document.getElementById('e-dl').value, active: document.getElementById('e-act').checked, source: src.value};
  }
  function refresh(){
    const ex = EXAMPLES[st.type];
    document.getElementById('cnt-box').classList.toggle('hidden', st.type !== 'test');
    document.getElementById('hint').innerHTML = `<b>Как писать:</b> ${ex.hint}<pre>${esc(ex.ex)}</pre><button class="btn sm" id="ins" style="margin-top:8px">Вставить пример</button><div class="small muted" style="margin-top:8px">Формулы набирайте обычным текстом: H2SO4 станет H<sub>2</sub>SO<sub>4</sub>, SO4^2- станет SO<sub>4</sub><sup>2-</sup>, а -&gt; превратится в стрелку.</div>`;
    document.getElementById('ins').onclick = () => { src.value = (src.value.trim() ? src.value.trim() + (st.type === 'quiz' || st.type === 'test' ? '\n\n' : '\n') : '') + ex.ex; refresh(); };
    const p = PARSE[st.type](src.value);
    const tp = document.getElementById('e-topic').value.trim(), known = (T.data.topics || []).some(t => t.title.toLowerCase() === tp.toLowerCase());
    document.getElementById('parse').innerHTML = (p.items.length ? `<span style="color:var(--good); font-weight:600">✓ Распознано: ${p.label(p.items.length)}</span>` : '<span class="muted">Пока нет заданий</span>') +
      (tp && !known ? `<div class="err">• Темы «${esc(tp)}» нет в каталоге — у учеников задание попадёт в раздел «Другие задания».</div>` : '') +
      p.errors.map(e => `<div class="err">• ${esc(e)}</div>`).join('');
  }
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { st.type = b.dataset.k; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b)); refresh(); });
  src.addEventListener('input', refresh);
  document.getElementById('e-topic').addEventListener('change', refresh);
  document.getElementById('cancel').onclick = teacherHome;
  document.getElementById('try').onclick = () => {
    const f = readForm(); Object.assign(st, f);
    play({...f, title: f.title || 'Без названия'}, {preview: true, onExit: () => editor(st)});
  };
  document.getElementById('save').onclick = async e => {
    const f = readForm(); const p = PARSE[f.type](f.source);
    if (!f.title.trim()){ toast('Укажите название'); return; }
    if (!p.items.length){ toast('Добавьте хотя бы одно задание'); return; }
    e.target.disabled = true; e.target.textContent = 'Сохраняем…';
    try { T.data.games = await api('saveGame', T.pw, f); T.tab = 'games'; toast('Сохранено'); teacherHome(); }
    catch (err){ toast(err.message); e.target.disabled = false; e.target.textContent = 'Сохранить'; }
  };
  refresh();
}

function renderResults(){
  const box = document.getElementById('tbody'), d = T.data, f = T.filter;
  const classes = [...new Set(d.results.map(r => r.className).filter(Boolean))].sort();
  const gameTitle = id => (d.games.find(g => g.id === id) || {}).title || (d.results.find(r => r.gameId === id) || {}).gameTitle || id;
  const gameIds = [...new Set(d.games.map(g => g.id).concat(d.results.map(r => r.gameId)))];
  const rs = d.results.filter(r => (!f.game || r.gameId === f.game) && (!f.cls || r.className === f.cls) && (!f.q || r.student.toLowerCase().includes(f.q.toLowerCase())));
  const groups = {};
  rs.forEach(r => {
    const k = r.gameId + '|' + r.student.toLowerCase() + '|' + r.className.toLowerCase();
    const g = groups[k] || (groups[k] = {k, gameId: r.gameId, student: r.student, cls: r.className, best: 0, attempts: [], last: ''});
    g.attempts.push(r); g.best = Math.max(g.best, r.percent); if (r.time > g.last) g.last = r.time;
  });
  const rows = Object.values(groups).sort((a, b) => gameTitle(a.gameId).localeCompare(gameTitle(b.gameId)) || a.cls.localeCompare(b.cls) || a.student.localeCompare(b.student, 'ru'));
  const avg = rows.length ? Math.round(rows.reduce((s, r) => s + r.best, 0) / rows.length) : 0;
  const weak = rows.filter(r => r.best < 50).length;
  box.innerHTML = `
    <div class="fgrid" style="margin-bottom:14px">
      <select class="field" id="fg"><option value="">Все игры</option>${gameIds.map(id => `<option value="${esc(id)}" ${f.game === id ? 'selected' : ''}>${esc(gameTitle(id))}</option>`).join('')}</select>
      <select class="field" id="fc"><option value="">Все классы</option>${classes.map(c => `<option ${f.cls === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <input class="field" id="fq" placeholder="Поиск ученика" value="${esc(f.q)}">
    </div>
    <div class="stats" style="margin-bottom:14px">
      <div class="stat"><span class="label">Учеников прошли</span><b>${new Set(rows.map(r => r.student.toLowerCase() + r.cls)).size}</b></div>
      <div class="stat"><span class="label">Средний лучший</span><b style="color:var(--${rows.length ? pctClass(avg) : 'muted'})">${rows.length ? avg + '%' : '—'}</b></div>
      <div class="stat"><span class="label">Ниже 50%</span><b style="color:var(--${weak ? 'bad' : 'muted'})">${weak}</b></div>
      <div class="stat"><span class="label">Всего попыток</span><b>${rs.length}</b></div>
    </div>
    ${rows.length ? `<div class="tscroll"><table>
      <thead><tr><th>Ученик</th><th>Класс</th><th>Игра</th><th>Лучший</th><th>Попыток</th><th>Последняя</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="click" data-k="${esc(r.k)}"><td><b>${esc(r.student)}</b></td><td>${esc(r.cls)}</td><td>${esc(gameTitle(r.gameId))}</td><td><span class="pill ${pctClass(r.best)}">${r.best}%</span></td><td class="num">${r.attempts.length}</td><td class="num">${esc(r.last)}</td></tr>` +
        (T.open === r.k ? `<tr class="sub"><td colspan="6">${r.attempts.slice().reverse().map(a => `<div style="padding:4px 0"><span class="num">${esc(a.time)}</span> — <b>${a.percent}%</b> (${a.score}/${a.max}), ${fmtSec(a.seconds)} · ${esc(a.details)}</div>`).join('')}</td></tr>` : '')).join('')}</tbody>
    </table></div><p class="small muted" style="margin-top:10px">Нажмите на строку, чтобы увидеть все попытки. Все данные также лежат в Google Таблице на листе «Результаты».</p>`
    : '<div class="empty panel">Результатов пока нет. Отправьте ученикам ссылку — их попытки появятся здесь.</div>'}`;
  document.getElementById('fg').onchange = e => { f.game = e.target.value; renderResults(); };
  document.getElementById('fc').onchange = e => { f.cls = e.target.value; renderResults(); };
  const fq = document.getElementById('fq'); fq.oninput = e => { f.q = e.target.value; clearTimeout(T.qt); T.qt = setTimeout(() => { renderResults(); const n = document.getElementById('fq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  box.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => { T.open = T.open === tr.dataset.k ? null : tr.dataset.k; renderResults(); });
}

/* ================= Старт ================= */
if (window.MODE === 'teacher'){ T.pw ? teacherLoad() : teacherLogin(); }
else urlStudent(p => {
  const u = String(p.u || '').trim().replace(/\s+/g, ' ').slice(0, 60), c = String(p.c || '').trim().toUpperCase().replace(/\s+/g, '').slice(0, 10);
  if (u.split(' ').length >= 2 && c){ S.student = {name: u, cls: c}; store('chem_student', S.student); }
  if (S.student) setUrlStudent(S.student);
  studentHome();
});
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
