  v.innerHTML = `<div class="sec"><h2>Рейтинг класса ${esc(S.student.cls)}</h2>
    ${boardAll.week ? `<div class="rseg"><button data-m="week" class="${wk ? 'on' : ''}">Эта неделя</button><button data-m="all" class="${wk ? '' : 'on'}">Всё время</button></div>` : ''}
    <p class="small muted" style="margin:-4px 0 12px">${wk ? 'Опыт за эту неделю (с понедельника). Каждую неделю рейтинг начинается заново — у всех есть шанс!' : 'Опыт = сумма ваших лучших процентов по всем заданиям. Улучшайте результаты, чтобы подняться выше.'}</p>
    ${board.top.length ? `<div class="list">${board.top.map((r, i) => { const L = levelOf(r.xp); return `<div class="rank ${r.me ? 'me' : ''}" style="animation-delay:${i * 40}ms">

      <span class="mini" title="${L.name}">${L.sym}</span>
      <div class="grow"><b>${esc(r.name)}</b>${r.me ? ' <span class="pill none">это вы</span>' : ''}<div class="small muted">Уровень ${L.n} · ${L.name}</div></div>
      <b style="font-variant-numeric:tabular-nums">${r.xp}</b></div>`; }).join('')}</div>

  v.querySelectorAll('.rseg button').forEach(b => b.onclick = () => { S.boardMode = b.dataset.m; sfx('tap'); renderRating(v, boardAll); });
}

const MAIL_KIND_LIST = [['idea', 'Идея'], ['bug', 'Ошибка'], ['question', 'Вопрос'], ['other', 'Другое']];
async function renderMail(v){
  const draftKey = 'chem_maildraft_' + S.student.name;
  let kind = 'idea', draft = ''; try { draft = localStorage.getItem(draftKey) || ''; } catch(e){}
  v.innerHTML = `<div class="sec"><div class="panel">
      <div style="display:flex; gap:12px; align-items:center"><span class="mic">${MAIL_IC}</span><div style="flex:1; min-width:0"><h3 style="margin:0; font-size:1.15rem">Написать разработчику</h3><div class="small muted">Сообщение увидит только разработчик. Ответ появится ниже, а на конверте сверху загорится цифра.</div></div></div>
      <div class="mkinds">${MAIL_KIND_LIST.map(k => `<button data-k="${k[0]}" class="${k[0] === kind ? 'on' : ''}">${k[1]}</button>`).join('')}</div>
      <textarea class="field mtext" id="mText" maxlength="1500" placeholder="Например: в тесте «Алканы» вопрос 5 — правильный ответ Б, а засчитывает В. Или: добавьте игру про…">${esc(draft)}</textarea>
      <div class="row" style="justify-content:space-between; margin-top:10px"><span class="small muted" id="mCnt">${draft.length} / 1500</span><button class="btn primary" id="mSend">Отправить</button></div>
    </div></div>
    <div class="sec"><h2>Мои сообщения</h2><div id="mList"><div class="loading" style="min-height:90px">Загружаем…</div></div></div>`;
  const ta = document.getElementById('mText'), cnt = document.getElementById('mCnt');
  ta.oninput = () => { cnt.textContent = ta.value.length + ' / 1500'; try { localStorage.setItem(draftKey, ta.value); } catch(e){} };
  v.querySelectorAll('.mkinds button').forEach(b => b.onclick = () => { kind = b.dataset.k; v.querySelectorAll('.mkinds button').forEach(x => x.classList.toggle('on', x === b)); });
  const load = async () => {
    const box = document.getElementById('mList'); if (!box) return;
    try {
      const list = await api('myFeedback', S.student.name, S.student.cls);
      if (S.data.mail && S.data.mail.unread){ S.data.mail.unread = 0; const bd = document.querySelector('#mailBtn .navbadge'); if (bd) bd.remove(); }
      box.innerHTML = list.length ? list.map(m => `<div class="msg ${m.isNew ? 'new' : ''}"><div class="mh"><span><b>${esc(m.kind)}</b></span><span>${esc(m.time)}</span></div>
          <div class="mt">${esc(m.text)}</div>
          ${m.reply ? `<div class="mr"><b>Ответ разработчика${m.isNew ? ' · новое' : ''} · ${esc(m.replyTime)}</b>${esc(m.reply)}</div>` : '<div class="mw">Ждёт ответа…</div>'}</div>`).join('')
        : '<div class="empty panel">Ты ещё ничего не писал. Первое сообщение — самое ценное!</div>';
    } catch (e){ box.innerHTML = `<div class="panel">Не удалось загрузить: ${esc(String(e.message || e))}</div>`; }
  };
  document.getElementById('mSend').onclick = async e => {
    const btn = e.currentTarget, text = ta.value.trim();
    if (text.length < 3){ toast('Напиши сообщение'); ta.focus(); return; }
    btn.disabled = true; btn.textContent = 'Отправляем…';
    try {
      await api('sendFeedback', S.student.name, S.student.cls, kind, text);
      ta.value = ''; cnt.textContent = '0 / 1500'; try { localStorage.removeItem(draftKey); } catch(e){}
      sfx('win'); toast('Отправлено! Спасибо'); load();
    } catch (err){ toast(String(err.message || err).replace(/^(Exception|Error):\s*/, '')); }
    btn.disabled = false; btn.textContent = 'Отправить';
  };
  load();
}

function renderTopic(title){
  const cat = catalog(), my = S.data.my;
  const t = cat.flatMap(s => s.topics.map(x => ({...x, section: s.section}))).find(x => x.title === title);
  if (!t){ S.topic = null; return S.section != null ? renderSection(S.section) : renderHome(); }
  S.topic = title;
  if (branchOf(t.section)) S.section = branchOf(t.section).name;
  app.innerHTML = `<div class="wrap">${topBar(S.section != null ? S.section : 'Главная')}
    <section class="hero" style="padding-bottom:22px">
      <div class="muted small">${esc(t.section)}</div>
      <h1 style="margin-top:4px">${esc(t.title)}</h1>
      <div class="small muted" style="margin-top:6px">Выполнено ${t.games.filter(g => my[g.id]).length} из ${t.games.length}. Начните с теста или разомнитесь на играх.</div>
    </section>
    <div class="grid2" style="margin-top:18px">${topicCardsItems(t).length ? `<button class="card cardsbtn" id="cardsBtn">${tile('cards')}<div class="grow"><h3>Карточки: ${esc(t.title)}</h3><div class="meta"><span>${plural(topicCardsItems(t).length, 'термин', 'термина', 'терминов')}</span><span>выучено ${(cardsLearned()[t.title] || []).length}</span></div></div><span class="pill none">учить</span></button>` : ''}${t.games.map((g, i) => {
      const p = PARSE[g.type](g.source), r = my[g.id];
      const n = g.type === 'test' && g.count && g.count < p.items.length ? plural(g.count, 'вопрос', 'вопроса', 'вопросов') : p.label(p.items.length);
      return `<button class="card" data-id="${esc(g.id)}" style="animation-delay:${i * 50}ms">${tile(g.type, i + 1)}
        <div class="grow"><h3>${esc(g.title)}</h3>
          <div class="meta"><span>${n}</span>${g.timeLimit ? `<span>⏱ ${g.timeLimit} мин</span>` : ''}${g.deadline ? `<span>${deadlineText(g.deadline)}</span>` : ''}${r ? `<span>попыток: ${r.attempts}</span>` : ''}</div></div>
        ${r ? `<span class="pill ${pctClass(r.best)}">${r.best}%</span>` : '<span class="pill none">новое</span>'}
      </button>`; }).join('')}</div></div>`;
  bindTop();
  app.querySelectorAll('.card[data-id]').forEach(b => b.onclick = () => { sfx('tap'); navPush(); play(t.games.find(g => g.id === b.dataset.id), {onExit: studentHome}); });
  const cb = document.getElementById('cardsBtn'); if (cb) cb.onclick = () => { sfx('tap'); navPush(); openCards(t); };
}

  app.innerHTML = `<div class="wrap narrow" style="padding-top:8vh">
    <div class="brand"><span class="el"><i>7</i>N</span><h1>Панель учителя</h1></div>
    <form class="panel" id="f" style="display:grid; gap:14px; margin-top:22px">
      <div class="fgroup"><label class="label" for="pw">Пароль</label><input class="field" id="pw" type="password" required autocomplete="current-password"></div>
      ${err ? `<div class="small" style="color:var(--bad)">${esc(err)}</div>` : ''}
      <button class="btn primary" type="submit">Войти</button>
    </form></div>`;
  document.getElementById('f').onsubmit = e => { e.preventDefault(); T.pw = document.getElementById('pw').value; teacherLoad(); };
}

async function teacherLoad(){
  app.innerHTML = '<div class="loading">Загрузка…</div>';
  try { T.data = await api('teacherData', T.pw); sstore('chem_pw', T.pw); teacherHome(); }
  catch (e){ sstore('chem_pw', null); teacherLogin(e.message); }
}

function teacherHome(){
  const d = T.data;
  const studentUrl = IN_GAS ? (d.url || '(ссылка появится после публикации)') : location.href.split(/[?#]/)[0];
  app.innerHTML = `<div class="wrap">
    <div class="row" style="justify-content:space-between">
      <div class="brand"><span class="el"><i>7</i>N</span><h1>Панель учителя</h1></div>
      <div class="row"><button class="btn sm" id="refresh">Обновить</button><button class="btn sm ghost" id="logout">Выйти</button></div>
    </div>
    <div class="panel" style="margin-top:18px; padding:14px 16px">
      <div class="label" style="margin-bottom:6px">Ссылка для учеников</div>
      <div class="linkbox"><input class="field" id="slink" readonly value="${esc(studentUrl)}"><button class="btn" id="copy">Копировать</button></div>
    </div>
    <div class="panel" style="margin-top:12px; padding:14px 16px">
      <div class="label" style="margin-bottom:6px">Помощник mini-Ramossitto (Google Gemini) — ${d.helper ? '<span class="pill good">включён</span>' : '<span class="pill warn">выключен</span>'}</div>
      <div class="linkbox"><input class="field" id="gkey" type="password" autocomplete="off" placeholder="${d.helper ? 'Ключ сохранён. Вставьте новый, чтобы заменить' : 'Вставьте ключ из aistudio.google.com/apikey'}"><button class="btn" id="gsave">Сохранить</button>${d.helper ? '<button class="btn ghost" id="goff">Выключить</button>' : ''}</div>
      <div class="small muted" style="margin-top:6px">Ключ хранится только на вашем Google-сервере. Ученики его не видят.</div>
    </div>
    <div class="row" style="justify-content:space-between; margin:22px 0 16px">
      <div class="tabs"><button data-t="games" class="${T.tab === 'games' ? 'on' : ''}">Задания (${d.games.length})</button><button data-t="topics" class="${T.tab === 'topics' ? 'on' : ''}">Темы (${(d.topics || []).length})</button><button data-t="results" class="${T.tab === 'results' ? 'on' : ''}">Результаты (${d.results.length})</button><button data-t="analytics" class="${T.tab === 'analytics' ? 'on' : ''}">Аналитика</button><button data-t="coins" class="${T.tab === 'coins' ? 'on' : ''}">Монеты и призы</button><button data-t="mail" class="${T.tab === 'mail' ? 'on' : ''}">Сообщения${d.mailNew ? `<span class="navbadge">${d.mailNew}</span>` : ''}</button></div>
      ${T.tab === 'games' ? '<button class="btn primary" id="new">+ Новое задание</button>' : ''}
    </div>
    <div id="tbody"></div></div>`;
  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { T.tab = b.dataset.t; teacherHome(); });
  document.getElementById('refresh').onclick = teacherLoad;
  const saveKey = async k => { try { const r = await api('setHelperKey', T.pw, k); T.data.helper = r.enabled; toast(r.enabled ? 'Помощник включён' : 'Помощник выключен'); teacherHome(); } catch (e){ toast(String(e.message || e).replace(/^(Exception|Error):\s*/, '')); } };
  document.getElementById('gsave').onclick = () => { const k = document.getElementById('gkey').value.trim(); if (!k){ toast('Вставьте ключ'); return; } saveKey(k); };
  const goff = document.getElementById('goff'); if (goff) goff.onclick = () => saveKey('');
  document.getElementById('logout').onclick = () => { sstore('chem_pw', null); T.pw = null; teacherLogin(); };
  document.getElementById('copy').onclick = () => {
    const inp = document.getElementById('slink');
    const fallback = () => { inp.select(); try { document.execCommand('copy'); toast('Ссылка скопирована'); } catch (e){ toast('Выделите ссылку и скопируйте вручную'); } };
    if (navigator.clipboard) navigator.clipboard.writeText(inp.value).then(() => toast('Ссылка скопирована'), fallback); else fallback();
  };
  if (T.tab === 'games'){ document.getElementById('new').onclick = () => editor(null); renderGames(); }
  else if (T.tab === 'topics') renderTopics();

  else if (T.tab === 'coins') renderCoinsAdmin();
  else if (T.tab === 'mail') renderMailAdmin();
  else renderResults();
}

function renderTopics(){
  const box = document.getElementById('tbody'), d = T.data;
  let text = '', sec = null;
  (d.topics || []).forEach(t => { if (t.section !== sec){ sec = t.section; if (sec) text += (text ? '\n' : '') + '# ' + sec + '\n'; } text += t.title + '\n'; });
  box.innerHTML = `<div class="panel" style="display:grid; gap:12px">
    <div class="hint"><b>Каталог тем.</b> У учеников три раздела: <b>Общая химия</b>, <b>Органическая химия</b>, <b>Неорганическая химия</b>. Строка с # — раздел, ниже — его темы, по одной на строку. Порядок здесь — порядок у учеников. В задании указывайте тему точно так же, как она записана здесь.
      <pre># Общая химия\nСтроение атома\nХимическая связь\n# Органическая химия\nАлканы\n# Неорганическая химия\nКислоты</pre>
      <button class="btn sm" id="tp-tpl" style="margin-top:8px">Добавить три раздела</button></div>
    <label class="label" for="tp-src">Темы</label>
    <textarea class="field" id="tp-src" spellcheck="false" style="min-height:340px">${esc(text)}</textarea>
    <div class="parse" id="tp-info"></div>
    <div class="row"><span class="grow"></span><button class="btn primary" id="tp-save">Сохранить каталог</button></div></div>`;
  const ta = document.getElementById('tp-src');
  const parse = () => { const out = []; let section = ''; ta.value.split('\n').forEach(l => { l = l.trim(); if (!l) return; if (l[0] === '#') section = l.replace(/^#+/, '').trim(); else out.push({section, title: l}); }); return out; };
  const info = () => {
    const list = parse(), names = new Set(list.map(t => t.title.toLowerCase()));
    const orphan = [...new Set(d.games.map(g => g.topic.trim()).filter(t => t && !names.has(t.toLowerCase())))];
    const noGames = list.filter(t => !d.games.some(g => g.topic.trim().toLowerCase() === t.title.toLowerCase())).length;
    document.getElementById('tp-info').innerHTML = `<span style="color:var(--good); font-weight:600">✓ ${plural(list.length, 'тема', 'темы', 'тем')}</span><span class="muted"> · без заданий: ${noGames}</span>` +
      (orphan.length ? `<div class="err">• Есть задания с темами не из каталога: ${orphan.map(esc).join(', ')}</div>` : '');
  };
  ta.addEventListener('input', info); info();
  document.getElementById('tp-tpl').onclick = () => {
    const have = new Set(ta.value.split('\n').filter(l => l.trim()[0] === '#').map(l => lc(l.replace(/^\s*#+/, ''))));
    const add = CHEM_BRANCHES.filter(b => !have.has(lc(b.name))).map(b => '# ' + b.name).join('\n\n');
    if (!add){ toast('Все три раздела уже есть'); return; }
    ta.value = (ta.value.trim() ? ta.value.trim() + '\n\n' : '') + add + '\n'; info(); toast('Разделы добавлены. Впишите темы под каждым и сохраните');
  };
  document.getElementById('tp-save').onclick = async e => {
    e.target.disabled = true;
    try { d.topics = await api('saveTopics', T.pw, parse()); toast('Каталог сохранён'); teacherHome(); }
    catch (err){ toast(err.message); e.target.disabled = false; }
  };
}

function renderGames(){
  const box = document.getElementById('tbody'), d = T.data;
  if (!d.games.length){ box.innerHTML = '<div class="empty panel">Заданий пока нет. Нажмите «+ Новое задание».</div>'; return; }
  const counts = {}; d.results.forEach(r => { (counts[r.gameId] = counts[r.gameId] || new Set()).add((r.student + '|' + r.className).toLowerCase()); });
  box.innerHTML = `<div class="list">${d.games.map((g, i) => {
    const p = PARSE[g.type](g.source), n = counts[g.id] ? counts[g.id].size : 0;
    return `<div class="trow" data-id="${esc(g.id)}">${tile(g.type, i + 1)}
      <div class="grow" style="min-width:180px"><h3 style="font-size:1.05rem; font-weight:600">${esc(g.title)}</h3>
        <div class="meta">${g.topic ? `<span>${esc(g.topic)}</span>` : ''}<span>${p.label(p.items.length)}</span>${g.className ? `<span>Классы: ${esc(g.className)}</span>` : '<span>Все классы</span>'}${g.timeLimit ? `<span>⏱ ${g.timeLimit} мин</span>` : ''}${g.deadline ? `<span>${deadlineText(g.deadline)}</span>` : ''}<span>Прошли: ${plural(n, 'ученик', 'ученика', 'учеников')}</span></div></div>
      <label class="row small" style="gap:8px" title="Видна ли игра ученикам"><span class="switch"><input type="checkbox" class="act" ${g.active ? 'checked' : ''} aria-label="Показывать ученикам"><span></span></span>${g.active ? 'Видна' : 'Скрыта'}</label>
      <div class="row" style="gap:6px"><button class="btn sm" data-a="try">Попробовать</button><button class="btn sm" data-a="edit">Изменить</button><button class="btn sm danger" data-a="del">Удалить</button></div>
    </div>`; }).join('')}</div>`;
  box.querySelectorAll('.trow').forEach(row => {
    const g = d.games.find(x => x.id === row.dataset.id);
    row.querySelector('[data-a="edit"]').onclick = () => editor(g);
    row.querySelector('[data-a="try"]').onclick = () => play(g, {preview: true, onExit: teacherHome});
    const del = row.querySelector('[data-a="del"]'); let armed = false;
    del.onclick = async () => {
      if (!armed){ armed = true; del.textContent = 'Точно удалить?'; setTimeout(() => { armed = false; if (del.isConnected) del.textContent = 'Удалить'; }, 3000); return; }
      del.disabled = true;
      try { d.games = await api('deleteGame', T.pw, g.id); toast('Игра удалена'); teacherHome(); } catch (e){ toast(e.message); del.disabled = false; }
    };
    row.querySelector('.act').onchange = async e => {
      e.target.disabled = true;
      try { d.games = await api('saveGame', T.pw, {...g, active: e.target.checked}); toast(e.target.checked ? 'Игра видна ученикам' : 'Игра скрыта'); teacherHome(); }
      catch (err){ toast(err.message); e.target.checked = !e.target.checked; e.target.disabled = false; }
    };
  });
}

function editor(g){
  const isNew = !g || !g.id;
  const st = g ? {...g} : {title: '', topic: '', type: 'test', source: '', timeLimit: 0, deadline: '', className: '', active: true, count: 0};
  const topicOpts = (T.data.topics || []).map(t => `<option value="${esc(t.title)}">${esc(t.section)}</option>`).join('');
  app.innerHTML = `<div class="wrap">
    <div class="row" style="justify-content:space-between; margin-bottom:18px">
      <button class="btn sm ghost" id="cancel">← Назад</button>
      <h1 style="font-family:var(--f-display); font-size:1.2rem">${isNew ? 'Новое задание' : 'Изменить задание'}</h1><span></span>
    </div>
    <div style="display:grid; gap:18px">
      <div class="panel" style="display:grid; gap:14px">
        <div class="fgroup"><span class="label">Тип задания</span><div class="seg" id="seg">${Object.keys(TYPES).map(k => `<button type="button" data-k="${k}" class="${st.type === k ? 'on' : ''}">${tile(k)}<span>${TYPES[k].name}</span></button>`).join('')}</div></div>
        <div class="fgrid">
          <div class="fgroup" style="grid-column:1/-1"><label class="label" for="e-title">Название</label><input class="field" id="e-title" maxlength="80" placeholder="Например: Классы неорганических веществ" value="${esc(st.title)}"></div>
          <div class="fgroup"><label class="label" for="e-topic">Тема из каталога</label><input class="field" id="e-topic" list="topics-dl" maxlength="120" placeholder="Начните вводить название темы" value="${esc(st.topic)}"><datalist id="topics-dl">${topicOpts}</datalist></div>
          <div class="fgroup"><label class="label" for="e-cls">Для классов</label><input class="field" id="e-cls" maxlength="60" placeholder="9А, 9Б (пусто — всем)" value="${esc(st.className)}"></div>
          <div class="fgroup"><label class="label" for="e-time">Время, минут</label><input class="field" id="e-time" type="number" min="0" max="120" value="${st.timeLimit || 0}"><span class="small muted">0 — без ограничения</span></div>
          <div class="fgroup" id="cnt-box"><label class="label" for="e-cnt">Вопросов ученику</label><input class="field" id="e-cnt" type="number" min="0" max="200" value="${st.count || 0}"><span class="small muted">Случайные из банка. 0 — все</span></div>
          <div class="fgroup"><label class="label" for="e-dl">Сдать до</label><input class="field" id="e-dl" type="date" value="${esc(st.deadline)}"></div>
        </div>
        <label class="row small"><span class="switch"><input type="checkbox" id="e-act" ${st.active ? 'checked' : ''}><span></span></span>Показывать ученикам сразу после сохранения</label>
      </div>
      <div class="panel" style="display:grid; gap:12px">
        <div class="hint" id="hint"></div>
        <label class="label" for="e-src">Задания</label>
        <textarea class="field" id="e-src" spellcheck="false">${esc(st.source)}</textarea>
        <div class="parse" id="parse"></div>
      </div>
      <div class="row"><button class="btn" id="try">Попробовать как ученик</button><span class="grow"></span><button class="btn primary" id="save">Сохранить</button></div>
    </div></div>`;
  const src = document.getElementById('e-src');
  function readForm(){
    return {...st, title: document.getElementById('e-title').value, topic: document.getElementById('e-topic').value,
      className: document.getElementById('e-cls').value.toUpperCase().replace(/\s+/g, ' ').trim(),
      timeLimit: Math.max(0, Math.min(120, parseInt(document.getElementById('e-time').value, 10) || 0)),
      count: Math.max(0, parseInt(document.getElementById('e-cnt').value, 10) || 0),
      deadline: document.getElementById('e-dl').value, active: document.getElementById('e-act').checked, source: src.value};
  }
  function refresh(){
    const ex = EXAMPLES[st.type];
    document.getElementById('cnt-box').classList.toggle('hidden', st.type !== 'test');
    document.getElementById('hint').innerHTML = `<b>Как писать:</b> ${ex.hint}<pre>${esc(ex.ex)}</pre><button class="btn sm" id="ins" style="margin-top:8px">Вставить пример</button><div class="small muted" style="margin-top:8px">Формулы набирайте обычным текстом: H2SO4 станет H<sub>2</sub>SO<sub>4</sub>, SO4^2- станет SO<sub>4</sub><sup>2-</sup>, а -&gt; превратится в стрелку.</div>`;
    document.getElementById('ins').onclick = () => { src.value = (src.value.trim() ? src.value.trim() + (st.type === 'quiz' || st.type === 'test' ? '\n\n' : '\n') : '') + ex.ex; refresh(); };
    const p = PARSE[st.type](src.value);
    const tp = document.getElementById('e-topic').value.trim(), known = (T.data.topics || []).some(t => t.title.toLowerCase() === tp.toLowerCase());
    document.getElementById('parse').innerHTML = (p.items.length ? `<span style="color:var(--good); font-weight:600">✓ Распознано: ${p.label(p.items.length)}</span>` : '<span class="muted">Пока нет заданий</span>') +
      (tp && !known ? `<div class="err">• Темы «${esc(tp)}» нет в каталоге — у учеников задание попадёт в раздел «Другие задания».</div>` : '') +
      p.errors.map(e => `<div class="err">• ${esc(e)}</div>`).join('');
  }
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { st.type = b.dataset.k; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b)); refresh(); });
  src.addEventListener('input', refresh);
  document.getElementById('e-topic').addEventListener('change', refresh);
  document.getElementById('cancel').onclick = teacherHome;
  document.getElementById('try').onclick = () => {
    const f = readForm(); Object.assign(st, f);
    play({...f, title: f.title || 'Без названия'}, {preview: true, onExit: () => editor(st)});
  };
  document.getElementById('save').onclick = async e => {
    const f = readForm(); const p = PARSE[f.type](f.source);
    if (!f.title.trim()){ toast('Укажите название'); return; }
    if (!p.items.length){ toast('Добавьте хотя бы одно задание'); return; }
    e.target.disabled = true; e.target.textContent = 'Сохраняем…';
    try { T.data.games = await api('saveGame', T.pw, f); T.tab = 'games'; toast('Сохранено'); teacherHome(); }
    catch (err){ toast(err.message); e.target.disabled = false; e.target.textContent = 'Сохранить'; }
  };
  refresh();
}

function renderResults(){
  const box = document.getElementById('tbody'), d = T.data, f = T.filter;
  const classes = [...new Set(d.results.map(r => r.className).filter(Boolean))].sort();
  const gameTitle = id => (d.games.find(g => g.id === id) || {}).title || (d.results.find(r => r.gameId === id) || {}).gameTitle || id;
  const gameIds = [...new Set(d.games.map(g => g.id).concat(d.results.map(r => r.gameId)))];
  const rs = d.results.filter(r => (!f.game || r.gameId === f.game) && (!f.cls || r.className === f.cls) && (!f.q || r.student.toLowerCase().includes(f.q.toLowerCase())));
  const groups = {};
  rs.forEach(r => {
    const k = r.gameId + '|' + r.student.toLowerCase() + '|' + r.className.toLowerCase();
    const g = groups[k] || (groups[k] = {k, gameId: r.gameId, student: r.student, cls: r.className, best: 0, attempts: [], last: ''});
    g.attempts.push(r); g.best = Math.max(g.best, r.percent); if (r.time > g.last) g.last = r.time;
  });
  const rows = Object.values(groups).sort((a, b) => gameTitle(a.gameId).localeCompare(gameTitle(b.gameId)) || a.cls.localeCompare(b.cls) || a.student.localeCompare(b.student, 'ru'));
  const avg = rows.length ? Math.round(rows.reduce((s, r) => s + r.best, 0) / rows.length) : 0;
  const weak = rows.filter(r => r.best < 50).length;
  box.innerHTML = `
    <div class="fgrid" style="margin-bottom:14px">
      <select class="field" id="fg"><option value="">Все игры</option>${gameIds.map(id => `<option value="${esc(id)}" ${f.game === id ? 'selected' : ''}>${esc(gameTitle(id))}</option>`).join('')}</select>
      <select class="field" id="fc"><option value="">Все классы</option>${classes.map(c => `<option ${f.cls === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <input class="field" id="fq" placeholder="Поиск ученика" value="${esc(f.q)}">
    </div>
    <div class="stats" style="margin-bottom:14px">
      <div class="stat"><span class="label">Учеников прошли</span><b>${new Set(rows.map(r => r.student.toLowerCase() + r.cls)).size}</b></div>
      <div class="stat"><span class="label">Средний лучший</span><b style="color:var(--${rows.length ? pctClass(avg) : 'muted'})">${rows.length ? avg + '%' : '—'}</b></div>
      <div class="stat"><span class="label">Ниже 50%</span><b style="color:var(--${weak ? 'bad' : 'muted'})">${weak}</b></div>
      <div class="stat"><span class="label">Всего попыток</span><b>${rs.length}</b></div>
    </div>
    ${rows.length ? `<div class="tscroll"><table>
      <thead><tr><th>Ученик</th><th>Класс</th><th>Игра</th><th>Лучший</th><th>Попыток</th><th>Последняя</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="click" data-k="${esc(r.k)}"><td><b>${esc(r.student)}</b></td><td>${esc(r.cls)}</td><td>${esc(gameTitle(r.gameId))}</td><td><span class="pill ${pctClass(r.best)}">${r.best}%</span></td><td class="num">${r.attempts.length}</td><td class="num">${esc(r.last)}</td></tr>` +
        (T.open === r.k ? `<tr class="sub"><td colspan="6">${r.attempts.slice().reverse().map(a => `<div style="padding:4px 0"><span class="num">${esc(a.time)}</span> — <b>${a.percent}%</b> (${a.score}/${a.max}), ${fmtSec(a.seconds)} · ${esc(a.details)}</div>`).join('')}</td></tr>` : '')).join('')}</tbody>
    </table></div><p class="small muted" style="margin-top:10px">Нажмите на строку, чтобы увидеть все попытки. Все данные также лежат в Google Таблице на листе «Результаты».</p>`
    : '<div class="empty panel">Результатов пока нет. Отправьте ученикам ссылку — их попытки появятся здесь.</div>'}`;
  document.getElementById('fg').onchange = e => { f.game = e.target.value; renderResults(); };
  document.getElementById('fc').onchange = e => { f.cls = e.target.value; renderResults(); };
  const fq = document.getElementById('fq'); fq.oninput = e => { f.q = e.target.value; clearTimeout(T.qt); T.qt = setTimeout(() => { renderResults(); const n = document.getElementById('fq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  box.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => { T.open = T.open === tr.dataset.k ? null : tr.dataset.k; renderResults(); });
}

/* ================= Старт ================= */
if (window.MODE === 'teacher'){ T.pw ? teacherLoad() : teacherLogin(); }
else urlStudent(p => {
  const u = String(p.u || '').trim().replace(/\s+/g, ' ').slice(0, 60), c = String(p.c || '').trim().toUpperCase().replace(/\s+/g, '').slice(0, 10);
  if (u.split(' ').length >= 2 && c){ S.student = {name: u, cls: c}; store('chem_student', S.student); }
  if (S.student) setUrlStudent(S.student);
  studentHome();
